<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 129 139">
  <title>Видеоэкран на опоре</title>
  <desc>Красное табло в чёрной рамке с белым треугольником, три стрелки вверх сверху, чёрная стойка с опорой. Прозрачный фон.</desc>

  <!-- стрелки вверх над экраном -->
  <g fill="#000000">
    <path d="M27 25 H39 L43 31 H23 Z"/>
    <rect x="31" y="31"/>
    <path d="M57 25 H69 L73 31 H53 Z"/>
    <rect x="61" y="31"/>
    <path d="M87 25 H99 L103 31 H83 Z"/>
    <rect x="91" y="31"/>
  </g>

  <!-- лицевая сторона экрана -->
  <rect x="22" y="44" fill="#E31E24"/>

  <!-- рамка экрана -->
  <rect x="19" y="41" fill="none" stroke="#000000" stroke-width="6"/>

  <!-- значок воспроизведения -->
  <path d="M56 53 L56 76 L72 64.5 Z" fill="#FFFFFF"/>

  <!-- стойка и опора -->
  <g fill="#000000">
    <rect x="59" y="89"/>
    <path d="M49 116 H77 L81 123 H44 Z"/>
  </g>
</svg>
