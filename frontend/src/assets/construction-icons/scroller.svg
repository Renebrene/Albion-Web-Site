<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 125 105">
  <title>Скроллер</title>
  <desc>Горизонтальное красное табло в чёрной рамке на чёрной стойке с опорой. Прозрачный фон.</desc>

  <!-- тень на земле -->
  <ellipse class="icon-ground-shadow" cx="65" cy="96" rx="24" ry="4" fill="#000000" opacity="0.3"/>

  <!-- лицевая сторона скроллера -->
  <rect x="34" y="11" width="64" height="43" fill="#E31E24"/>

  <!-- рамка скроллера -->
  <rect x="31" y="8" width="69" height="48" fill="none" stroke="#000000" stroke-width="6"/>

  <!-- стойка и опора -->
  <g fill="#000000">
    <rect x="61" y="56" width="9" height="33"/>
    <path d="M60 89 H70 L86 97 H45 Z"/>
  </g>
</svg>
