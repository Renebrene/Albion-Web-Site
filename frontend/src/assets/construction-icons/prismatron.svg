<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 212">
  <title>Рекламный щит на опоре (ребристый)</title>
  <desc>Красное табло в чёрной рамке с чёрными вертикальными рёбрами, три стрелки вверх сверху, чёрная стойка с опорой. Прозрачный фон. Палитра: #E31E24 и #000000.</desc>

  <!-- стрелки вверх над щитом -->
  <g fill="#000000">
    <path d="M56 14 H70 L75 25 H51 Z"/>
    <rect x="61" y="23"/>
    <path d="M118 14 H132 L137 25 H113 Z"/>
    <rect x="123" y="23"/>
    <path d="M180 14 H194 L199 25 H175 Z"/>
    <rect x="185" y="23"/>
  </g>

  <!-- лицевая сторона щита: сплошной красный прямоугольник -->
  <rect x="47" y="45" fill="#E31E24"/>

  <!-- вертикальные рёбра -->
  <g fill="#000000">
    <rect x="50" y="45"/>
    <rect x="59" y="45"/>
    <rect x="68" y="45"/>
    <rect x="77" y="45"/>
    <rect x="86" y="45"/>
    <rect x="95" y="45"/>
    <rect x="104" y="45"/>
    <rect x="113" y="45"/>
    <rect x="122" y="45"/>
    <rect x="131" y="45"/>
    <rect x="140" y="45"/>
    <rect x="149" y="45"/>
    <rect x="158" y="45"/>
    <rect x="167" y="45"/>
    <rect x="176" y="45"/>
    <rect x="185" y="45"/>
    <rect x="194" y="45"/>
  </g>

  <!-- рамка щита -->
  <rect x="43.5" y="41.5" fill="none" stroke="#000000" stroke-width="7"/>

  <!-- стойка и опора -->
  <g fill="#000000">
    <rect x="116" y="134"/>
    <path d="M94 188 H156 L163 201 H87 Z"/>
  </g>
</svg>
