<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Yandex Maps Test (API 2.1)</title>

<style>
html, body, #map {
    width: 100%;
    height: 100%;
    margin: 0;
}

#status {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10000;
    padding: 15px 20px;
    background: white;
    border-radius: 10px;
    font-family: Arial;
    box-shadow: 0 4px 20px rgba(0,0,0,.2);
}
</style>
</head>

<body>

<div id="status">Загрузка Яндекс Карт…</div>
<div id="map"></div>

<script>
/*
 * Ручной тест Yandex Maps JS API 2.1 — той же версии, что использует сайт
 * (см. frontend/src/map/yandexLoader.js). Ключ НЕ хранится в файле: передайте
 * его в адресе страницы, например:
 *
 *   test-yandex.html?apikey=ВАШ_КЛЮЧ
 */
const status = document.getElementById('status')

const apikey = new URLSearchParams(location.search).get('apikey')

if (!apikey) {
    status.innerHTML =
        "<b style='color:red'>Укажите ключ:</b> test-yandex.html?apikey=…"
} else {
    const script = document.createElement('script')
    script.src =
        'https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=' +
        encodeURIComponent(apikey)
    script.onload = init
    script.onerror = () => {
        status.innerHTML = "<b style='color:red'>Не удалось загрузить API</b>"
    }
    document.head.appendChild(script)
}

function init() {
    if (!window.ymaps) {
        status.innerHTML = "<b style='color:red'>ymaps недоступен</b>"
        return
    }

    ymaps.ready(() => {
        try {
            new ymaps.Map('map', {
                center: [47.2357, 39.7015],
                zoom: 11
            })

            status.innerHTML =
                "<b style='color:green'>✓ Яндекс Карты API 2.1 работает</b>"
        } catch (error) {
            console.error(error)
            status.innerHTML =
                "<b style='color:red'>Ошибка API</b><br>" + String(error)
        }
    })
}
</script>

</body>
</html>
