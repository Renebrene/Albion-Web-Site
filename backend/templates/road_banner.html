<title>Альбион — светофорные объекты</title>
<!--
  Код 3D-баннера для слайда главной «Светофорные объекты».
  Редактируется в отдельной закладке админки «Баннер-дорога».
  Это самостоятельный HTML-документ: он открывается в sandbox-iframe
  поверх нижней части слайда. Внешние скрипты — только three.js с CDN.
-->
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #9fd4ec; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: #9fd4ec; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #fallback { display: none; position: absolute; inset: 0; z-index: 3; }
  #fallback svg { width: 100%; height: 100%; display: block; }
  .fallback-note { position: absolute; bottom: 12px; right: 14px; font: 12px/1.4 system-ui, sans-serif; color: #f5ead9; background: rgba(13, 18, 32, .7); padding: 5px 11px; border-radius: 99px; }

  /* HUD — оверлей с погодой, пробками, временем (минималистичный) */
  #hud {
    position: absolute;
    /* У верхнего края баннера, но с отступом от левого края страницы. */
    top: 10px;
    left: clamp(16px, 6%, 80px);
    right: 12px;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    pointer-events: none;
  }

  .hud-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    background: rgba(13, 18, 32, 0.65);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 6px;
    color: #f5ead9;
    font: 11px/1.3 system-ui, sans-serif;
    pointer-events: auto;
  }

  .hud-item b {
    color: #fff;
    font-weight: 700;
  }

  /* Обрезка левого края применяется к сцене, а не ко всему документу:
     HUD остаётся в видимом левом углу баннера. */
  #stage {
    overflow: hidden;
  }

  #stage canvas {
    --rr-crop-left: 18%;
    --rr-crop-scale: 1.22;
    transform: scaleX(var(--rr-crop-scale)) translateX(calc(-1 * var(--rr-crop-left)));
    transform-origin: left center;
  }

  .hud-weather {
    font-size: 26px;
  }

  .hud-temp {
    font-size: 22px;
    font-weight: 700;
  }

  .hud-traffic {
    min-width: 0;
    padding: 3px 5px;
    gap: 2px;
  }

  /* Балл пробок — круг с числом по шкале Яндекса (0-3 / 4-6 / 7-9 / 10). */
  .hud-traffic-dot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #2fd27d;
    color: #08120c;
    font-size: 22px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.22);
    transition: background 0.3s;
  }

  .hud-traffic-dot.level-free {
    background: #2fd27d;
    color: #08120c;
  }

  .hud-traffic-dot.level-moderate {
    background: #ffb020;
    color: #241600;
  }

  .hud-traffic-dot.level-jam {
    background: #ff4d5e;
    color: #fff;
  }

  .hud-traffic-dot.level-gridlock {
    background: #9b111e;
    color: #fff;
  }

  .hud-holiday {
    color: #ffe9a8;
  }

  .hud-holiday[hidden] {
    display: none;
  }

  .hud-precip {
    font-size: 12px;
  }

  .hud-precip[hidden] {
    display: none;
  }
</style>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= НАСТРОЙКИ ИЗ КОДА ================= */
// Админка редактирует блок #banner-settings; здесь он превращается
// в плоский объект значений.
function readSettings(){
  const el = document.getElementById('banner-settings');
  if(!el) return {};

  try {
    const raw = JSON.parse(el.textContent || '{}');
    const values = {};
    Object.entries(raw).forEach(([key, item]) => {
      values[key] = (item && typeof item === 'object' && 'value' in item)
        ? item.value
        : item;
    });
    return values;
  } catch (e) {
    return {};
  }
}
const SET = readSettings();
const num = (key, fallback, min, max) => {
  const value = Number(SET[key]);
  if(!Number.isFinite(value)) return fallback;
  return Math.max(min, Math.min(max, value));
};
const flag = (key, fallback) => (
  SET[key] === undefined ? fallback : Boolean(SET[key])
);

/* Синхронизация с внешними данными. По умолчанию включена: баннер показывает
   реальную погоду, пробки, текущее время суток и праздничные даты. */
const LIVE = {
  weather: flag('syncWeather', true),
  time: flag('syncTime', true),
  traffic: flag('syncTraffic', true),
  holidays: flag('syncHolidays', true)
};

/* Визуальные параметры проекции (задаются presets в админке). */
const VIS = {
  speed: num('speedFactor', 1, 0.2, 2),
  flow: num('flowDensity', 1, 0.5, 3),
  shadows: flag('shadows', true),
  grid: flag('grid', false),
  weatherPreset: String(SET.weatherPreset || 'auto'),
  precipitation: num('precipitation', 0, 0, 1),
  wind: num('wind', 0.25, 0, 2),
  lightning: num('lightning', 0, 0, 2),
  fog: num('fog', 0, 0, 1),
  brightness: num('brightness', 1, 0.4, 1.6),
  holidayPreset: String(SET.holidayPreset || 'none'),
  decorDensity: num('decorDensity', 1, 0, 2),
  decorSize: num('decorSize', 1, 0.5, 2),
  decorGlow: num('decorGlow', 1, 0, 2),
  decoTrees: flag('decoTrees', false),
  decoSnowfall: flag('decoSnowfall', false),
  decoSnowman: flag('decoSnowman', false),
  decoFlowers: flag('decoFlowers', false),
  decoFlags: flag('decoFlags', false),
  decoGarlands: flag('decoGarlands', false),
  decoStars: flag('decoStars', false),
  decoHearts: flag('decoHearts', false),
  decoSnowdrifts: flag('decoSnowdrifts', false),
  decoSleigh: flag('decoSleigh', false)
};

const decoKeys = [
  'decoTrees', 'decoSnowfall', 'decoSnowman',
  'decoFlowers', 'decoFlags', 'decoGarlands', 'decoStars', 'decoHearts',
  'decoSnowdrifts', 'decoSleigh'
];

/* Режим «По умолчанию»: баннер синхронизируется с реальной погодой, временем,
   пробками и праздниками; ручные настройки и сценарии не применяются.
   «Произвольный» — пользователь задаёт пресеты и сценарии сам. */
const CUSTOM = String(SET.mode || 'default') === 'custom';

if (!CUSTOM) {
  LIVE.weather = true;
  LIVE.time = true;
  LIVE.traffic = true;
  LIVE.holidays = true;
  VIS.weatherPreset = 'auto';
  VIS.holidayPreset = 'none';
  VIS.precipitation = 0;
  VIS.lightning = 0;
  VIS.fog = 0;
  VIS.brightness = 1;
  VIS.speed = 1;
  VIS.flow = 1;
  decoKeys.forEach(k => { VIS[k] = false; });
}

/* ================= КОНФИГ ================= */
const QUALITY = ['eco','balanced','max'].includes(String(SET.quality))
  ? String(SET.quality)
  : 'eco';
const DEFAULTS = {
  speed:1, density:1, theme:'day', parallax:false,
  quality:QUALITY, paused:flag('paused', false), mode:'iso', buses:flag('buses', true)
};
const CFG = { ...DEFAULTS };
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (RM) { CFG.paused = true; CFG.parallax = false; }

const CYCLE = { g:9, y:2.2, r:8 }; CYCLE.total = CYCLE.g + CYCLE.y + CYCLE.r;

function radialTex(inner, outer){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64,64,4,64,64,62);
  gr.addColorStop(0, inner); gr.addColorStop(1, outer);
  g.fillStyle = gr; g.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const shadowTex = radialTex('rgba(10,12,20,0.42)','rgba(10,12,20,0)');
const glowTex   = radialTex('rgba(255,255,255,1)','rgba(255,255,255,0)');
/* Капля дождя — вытянутый штрих, а не круглая точка. */
function rainStreakTex(){
  const c = document.createElement('canvas'); c.width = 32; c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0,0,0,64);
  gr.addColorStop(0,'rgba(190,225,255,0)');
  gr.addColorStop(0.3,'rgba(200,232,255,0.85)');
  gr.addColorStop(1,'rgba(240,250,255,1)');
  g.fillStyle = gr;
  g.beginPath(); g.moveTo(13,0); g.lineTo(19,0); g.lineTo(22,64); g.lineTo(10,64); g.closePath(); g.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
/* Снежинка — шестилучевая звёздочка. */
function snowflakeTex(){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); g.translate(32,32);
  g.strokeStyle = 'rgba(255,255,255,1)'; g.lineWidth = 4; g.lineCap = 'round';
  for(let i=0;i<6;i++){
    g.rotate(Math.PI/3);
    g.beginPath(); g.moveTo(0,0); g.lineTo(0,-27);
    g.moveTo(0,-16); g.lineTo(-8,-22); g.moveTo(0,-16); g.lineTo(8,-22);
    g.stroke();
  }
  g.fillStyle = 'rgba(255,255,255,1)'; g.beginPath(); g.arc(0,0,4,0,Math.PI*2); g.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const rainStreak = rainStreakTex();

function drawAd(){
  const g = adCanvas.getContext('2d'), w = 1024, h = 512;
  g.fillStyle = '#ffffff'; g.fillRect(0,0,w,h);
  g.strokeStyle = '#e03131'; g.lineWidth = 14; g.strokeRect(18,18,w-36,h-36);
  g.fillStyle = '#e03131'; g.textAlign = 'center'; g.textBaseline = 'middle';
  let size = 230;
  g.font = `900 ${size}px 'Arial Black', Arial, sans-serif`;
  const maxW = w - 120;
  const tw = g.measureText('АЛЬБИОН').width;
  if(tw > maxW){ size = Math.floor(size * maxW / tw); g.font = `900 ${size}px 'Arial Black', Arial, sans-serif`; }
  g.fillText('АЛЬБИОН', w/2, h/2 + size*.04);
  adTex.needsUpdate = true;
}

/* Неоновая вывеска на фасаде (одна надпись на здание). */
function neonTex(text, color) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(5,9,20,0.94)'; g.fillRect(0,0,512,128);
  g.strokeStyle = color; g.lineWidth = 4; g.strokeRect(10,10,492,108);
  g.shadowColor = color; g.shadowBlur = 18;
  g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
  let size = text.length > 9 ? 54 : 70;
  g.font = `900 ${size}px 'Arial Black', Arial, sans-serif`;
  g.fillText(text, 256, 68);
  g.shadowBlur = 0;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

function edgeWalk(segs, zEdge, zWalk){
  segs.forEach(([a,b]) => {
    const len = b-a, cx = (a+b)/2;
    const edge = new THREE.Mesh(new THREE.BoxGeometry(len,.02,.14), M.mark);
    edge.position.set(cx,.011,zEdge); scene.add(edge);
    const walk = new THREE.Mesh(new THREE.BoxGeometry(len,.24,2.2), M.walk);
    walk.position.set(cx,0,zWalk); scene.add(walk);
  });
}

const dummy = new THREE.Object3D();
function instanced(geo, mat, transforms){
  const im = new THREE.InstancedMesh(geo, mat, transforms.length);
  transforms.forEach((tr,i) => {
    dummy.position.set(tr.x, tr.y ?? .012, tr.z);
    dummy.rotation.set(0, tr.ry ?? 0, 0);
    dummy.scale.setScalar(1); dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);
  });
  im.instanceMatrix.needsUpdate = true; scene.add(im); return im;
}

/* Автомобильные светофоры — на Г-образных штангах у угла перекрёстка.
   Стойка стоит на тротуаре перед стоп-линией, консоль выносит головку
   над полосой: светофор не занимает проезжую часть. Пешеходные
   светофоры на отдельных стойках остаются как есть. */
const carLights = [];
function carLightHead(x, z, faceSign, ixIdx) {
  const g = new THREE.Group();

  // Вертикальная стойка на тротуаре, у угла перекрёстка.
  const poleH = 6.1;
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(.08,.11,poleH,8), M.pole);
  pole.position.y = poleH/2; g.add(pole);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(.24,.28,.16,10), M.housing);
  base.position.y = .08; g.add(base);

  // Консоль «Г» идёт от стойки к середине полосы.
  const armDir = -Math.sign(z);
  const armLen = Math.abs(z) - LANE_Z;
  const armY = poleH - .25;
  const arm = new THREE.Mesh(new THREE.BoxGeometry(.12,.12,armLen), M.pole);
  arm.position.set(0, armY, armDir*armLen/2); g.add(arm);

  const head = new THREE.Group();
  const housing = new THREE.Mesh(new THREE.BoxGeometry(.42,1.55,.55), M.housing);
  head.add(housing);
  const bulbs = { r:[], y:[], g:[] };
  [['r',.5],['y',0],['g',-.5]].forEach(([k,dy]) => {
    [-.16,.16].forEach(bz => {
      const b = new THREE.Mesh(bulbGeo, bulbMats[k].off);
      b.position.set(faceSign*.23, dy, bz); head.add(b); bulbs[k].push(b);
    });
  });
  const glow = glowSprite(0x2fe07d, 1.7, .5);
  glow.position.set(faceSign*.34, -.5, 0); head.add(glow);
  // Головка висит над полосой, на конце консоли.
  head.position.set(0, armY - .45, armDir*armLen); g.add(head);

  g.position.set(x, 0, z); scene.add(g);
  carLights.push({ ixIdx, bulbs, glow });
}
IX.forEach((ix, ixIdx) => {
  // Стойки перед стоп-линией, справа по ходу каждой полосы.
  carLightHead(ix.x - (STOP_OFF + .6),  4.7, -1, ixIdx); // поток +x
  carLightHead(ix.x + (STOP_OFF + .6), -4.7,  1, ixIdx); // поток -x
});

const BULB_Y = { r:3.92, y:3.5, g:3.08 }, BULB_C = { r:0xff3b4d, y:0xffc233, g:0x2fe07d };
const CAR_BULB_Y = { r:.5, y:0, g:-.5 };
function lightState(ix, t){
  // Сценарий может принудительно задать фазу на ограниченное время.
  if(ix.forcePhase){
    if(t < ix.forcePhase.until) return ix.forcePhase.state;
    ix.forcePhase = null;
  }
  const p = (t + ix.phase) % CYCLE.total;
  return p < CYCLE.g ? 'g' : p < CYCLE.g + CYCLE.y ? 'y' : 'r';
}
// Пешеходные светофоры работают в противофазе с автомобильными:
// зелёный для пешеходов — только когда машинам горит красный, с небольшой
// паузой на очистку перекрёстка.
function pedLightState(ix, t){
  if(ix.forcePhase && t < ix.forcePhase.until){
    return ix.forcePhase.state === 'g' ? 'r' : 'g';
  }
  const p = (t + ix.phase) % CYCLE.total;
  const redStart = CYCLE.g + CYCLE.y;
  return p > redStart + 1 && p < CYCLE.total - 1 ? 'g' : 'r';
}

const carPool = Array.from({ length:14 }, buildCar);
const cars = [];
function spawnCar(dir, atX){
  const c = carPool.find(c => !c.active); if(!c) return false;
  const spawnX = atX ?? -dir*(ROAD_HALF+2);
  if(cars.some(o => o.dir === dir && Math.abs(o.x - spawnX) < 7)) return false;
  if(buses.some(b => Math.abs(b.x - spawnX) < 9)) return false;
  c.active = true; c.dir = dir; c.x = spawnX; c.z = dir > 0 ? LANE_Z : -LANE_Z;
  c.max = rand(5.2,6.8); c.speed = atX ? c.max*.8 : c.max*.5; c.prevSpeed = c.speed;
  c.body.material = carMats[Math.floor(Math.random()*carMats.length)];
  c.g.position.set(c.x, 0, c.z);
  c.g.rotation.y = dir > 0 ? 0 : Math.PI;
  c.g.visible = true; cars.push(c); return true;
}
function despawnCar(c){ c.active = false; c.g.visible = false; cars.splice(cars.indexOf(c),1); }

const busPool = [buildBus(0), buildBus(1)];
const buses = [];
let busSpawnT = rand(30,46);
function spawnBus(atX){
  const b = busPool.find(b => !b.active); if(!b) return false;

  // Один автобус идёт справа налево по дальней полосе, второй — слева
  // направо по ближней; каждый останавливается у своей остановки.
  const dir = busPool.indexOf(b) === 0 ? -1 : 1;
  const x = atX ?? (dir < 0 ? ROAD_HALF + 3 : -(ROAD_HALF + 3));
  if(cars.some(c => c.dir === dir && Math.abs(c.x - x) < 9)) return false;
  if(buses.some(o => Math.abs(o.x - x) < 14)) return false;

  b.dir = dir;
  b.side = dir < 0 ? -1 : 1;
  b.laneZ = dir < 0 ? -LANE_Z : LANE_Z;
  b.stopX = dir < 0 ? BUS_STOP_X : BUS_STOP2_X;
  b.bayZ = dir < 0 ? BAY_Z : BAY2_Z;
  b.routeName = dir < 0 ? 'ЦУМ' : 'Другая сторона';
  b.g.rotation.y = dir < 0 ? Math.PI : 0;

  b.active = true; b.x = x; b.z = b.laneZ; b.speed = b.max*.6; b.prevSpeed = b.speed;
  b.state = 'run'; b.willStop = true; b.doorT = 0; b.dwellT = 0; b.boardTimer = .7;
  b.g.position.set(b.x,0,b.z); b.g.visible = true; buses.push(b);
  flashBus(`Автобус ${dir < 0 ? '1' : '2'} вышел на маршрут`);
  return true;
}
function despawnBus(b){ b.active = false; b.g.visible = false; buses.splice(buses.indexOf(b),1); }
let flashT = null;
function flashBus(txt){
  const el = $('busFlash'); if(!el) return;
  el.textContent = txt; el.classList.add('show');
  clearTimeout(flashT); flashT = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ================= ПЕШЕХОДЫ: ПЕРЕХОД (пул) ================= */
function buildPed(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(.34,.6,.24), pedMats[0]); body.position.y = .5; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.15,10,8), skinMat); head.position.y = .95; g.add(head);
  g.visible = false; scene.add(g);
  return { g, body, active:false, x:0, z:0, dz:1, speed:2.2, seed:Math.random()*10,
           state:'wait', ix:null };
}
const pedPool = Array.from({ length:6 }, buildPed);
const peds = [];
function spawnPed(ix){
  const p = pedPool.find(p => !p.active); if(!p) return;
  const zx = ix.x + (Math.random() < .5 ? -ZEBRA_OFF : ZEBRA_OFF);
  const startZ = Math.random() < .5 ? 5.3 : -5.3;
  p.active = true; p.ix = ix; p.state = 'wait';
  p.x = zx + rand(-1.4,1.4); p.z = startZ; p.dz = -Math.sign(startZ);
  p.speed = rand(2,2.6);
  p.body.material = pedMats[Math.floor(Math.random()*pedMats.length)];
  p.g.position.set(p.x,0,p.z); p.g.visible = true; peds.push(p);
}
// Не начинаем переход, пока рядом движется машина или автобус.
function crosswalkClear(p){
  const carNear = cars.some(c => c.speed > .5 && Math.abs(c.x - p.x) < 14);
  const busNear = buses.some(b => b.speed > .5 && Math.abs(b.x - p.x) < 18);
  return !carNear && !busNear;
}

/* ================= ПЕШЕХОДЫ: ОСТАНОВКА «ЦУМ» (пул) ================= */
function buildStopPed(){
  const p = buildPed();
  return Object.assign(p, { state:'in', side:-1, homeX:SHELTER_X, tx:0, tz:WAIT_Z, outDir:1, boardT:0, bus:null });
}
const stopPool = Array.from({ length:8 }, buildStopPed);
const stopPeds = [];
let pedSpawnT = 2;
function waitSpot(side = -1){
  const home = side < 0 ? SHELTER_X : SHELTER2_X;
  return { x:home + rand(-2.2,2.2), z: side < 0 ? WAIT_Z : WAIT2_Z };
}
function spawnStopPed(state, x, z, side = -1){
  const p = stopPool.find(p => !p.active); if(!p) return null;
  const spot = waitSpot(side);
  p.active = true; p.state = state; p.side = side;
  p.homeX = side < 0 ? SHELTER_X : SHELTER2_X;
  p.x = x; p.z = z; p.tx = spot.x; p.tz = spot.z;
  p.speed = rand(1.4,1.8); p.boardT = 0; p.bus = null; p.outDir = Math.random() < .5 ? -1 : 1;
  p.body.material = pedMats[Math.floor(Math.random()*pedMats.length)];
  p.g.scale.setScalar(1); p.g.position.set(x,0,z); p.g.visible = true;
  stopPeds.push(p); return p;
}
function despawnStopPed(p){ p.active = false; p.g.visible = false; p.bus = null; stopPeds.splice(stopPeds.indexOf(p),1); }
function sidewalkZ(x, side = -1){
  const home = side < 0 ? SHELTER_X : SHELTER2_X;
  const wait = side < 0 ? WAIT_Z : WAIT2_Z;
  const edge = side < 0 ? -5.0 : 5.0;
  return Math.abs(x - home) < 7 ? wait : edge;
}
function movePed(p, tx, tz, sp, wdt){
  const dx = tx - p.x, dz = tz - p.z, d = Math.hypot(dx,dz);
  if(d > .001){
    const step = Math.min(d, sp*wdt);
    p.x += dx/d*step; p.z += dz/d*step;
    p.g.rotation.y = Math.atan2(dx,dz);
  }
  return d;
}
for(let i=0;i<3;i++){
  const s = waitSpot();
  const p = spawnStopPed('idle', s.x, s.z);
  if(p){ p.tx = s.x; p.tz = s.z; }
}

/* ================= СИМУЛЯЦИЯ ================= */
let simTime = 0;
const spawnT = [1, 2.2];
const prevState = ['g','g'];

// «Живой» трафик: плотность и количество меняются случайно, а скорость
// плавно ходит волной. Светофорный цикл при этом остаётся ровным.
const trafficLow = num('trafficMin', 0.55, 0.2, 3);
const trafficHigh = num('trafficMax', 1.9, 0.2, 3);
const TRAFFIC_MIN = Math.min(trafficLow, trafficHigh);
const TRAFFIC_MAX = Math.max(trafficLow, trafficHigh);
const trafficTimeLow = num('trafficChangeMin', 5, 1, 120);
const trafficTimeHigh = num('trafficChangeMax', 12, 1, 120);
const TRAFFIC_TIME_MIN = Math.min(trafficTimeLow, trafficTimeHigh);
const TRAFFIC_TIME_MAX = Math.max(trafficTimeLow, trafficTimeHigh);
const carLow = Math.floor(num('carMin', 6, 1, 14));
const carHigh = Math.floor(num('carMax', 13, 1, 14));
const CAR_MIN = Math.min(carLow, carHigh);
const CAR_MAX = Math.max(carLow, carHigh);
const pedLow = Math.floor(num('pedMin', 1, 0, 8));
const pedHigh = Math.floor(num('pedMax', 5, 0, 8));
const PED_MIN = Math.min(pedLow, pedHigh);
const PED_MAX = Math.max(pedLow, pedHigh);
const countTimeLow = num('countChangeMin', 6, 1, 120);
const countTimeHigh = num('countChangeMax', 14, 1, 120);
const COUNT_TIME_MIN = Math.min(countTimeLow, countTimeHigh);
const COUNT_TIME_MAX = Math.max(countTimeLow, countTimeHigh);
const SPEED_WAVE_AMP = num('speedWave', 0.35, 0, 0.8);
const SPEED_WAVE_FREQ = 2 * Math.PI / num('speedWavePeriod', 19.6, 4, 60);

let trafficDensity = TRAFFIC_MIN;
let trafficTimer = rand(TRAFFIC_TIME_MIN, TRAFFIC_TIME_MAX);
let carTarget = Math.floor(rand(CAR_MIN, CAR_MAX + 1));
let pedTarget = Math.floor(rand(PED_MIN, PED_MAX + 1));
let countTimer = rand(COUNT_TIME_MIN, COUNT_TIME_MAX);
spawnCar(1,-50); spawnCar(1,-26); spawnCar(1,-4);
spawnCar(-1,50); spawnCar(-1,26); spawnCar(-1,4);
// По автобусу в каждом направлении уже на старте.
spawnBus(40); spawnBus(-40);

function vehicleObstacleDist(v, front){
  let dist = Infinity;
  IX.forEach(ix => {
    const lineX = ix.x - v.dir*STOP_OFF;
    const d = (lineX - front)*v.dir;
    if(d > -.3){
      const st = lightState(ix, simTime);
      if(st === 'r' || (st === 'y' && d > 2.0)) dist = Math.min(dist, d);
    }

    // Зебра и сам перекрёсток — зона, где нельзя стоять. Не въезжаем в
    // неё, пока впереди нет места, чтобы полностью выйти за дальнюю зебру:
    // иначе машина встанет посреди перехода или перекрёстка.
    const entry = ix.x - v.dir*(ZEBRA_OFF + NO_STOP_PAD);
    const exit = ix.x + v.dir*(ZEBRA_OFF + NO_STOP_PAD);
    const before = (entry - front)*v.dir;
    if(before > 0 && Number.isFinite(dist)){
      const stopFront = front + v.dir*Math.max(0, dist);
      const rearAfterStop = stopFront - v.dir*v.len;
      const clearsZone = (rearAfterStop - exit)*v.dir > 0.2;
      if(!clearsZone) dist = Math.min(dist, before);
    }
  });
  cars.forEach(o => {
    if(o === v || o.dir !== v.dir) return;
    const dx = (o.x - v.x)*v.dir;
    if(dx > 0) dist = Math.min(dist, dx - (o.len + v.len)/2 - .35);
  });
  buses.forEach(o => {
    // Встречный автобус идёт по своей полосе и не является препятствием.
    if(o === v || o.dir !== v.dir || Math.abs(o.z) > 2.9) return;
    const dx = (o.x - v.x)*v.dir;
    if(dx > 0) dist = Math.min(dist, dx - (o.len + v.len)/2 - .45);
  });
  // Машина, уже вошедшая на перекрёсток, должна его покинуть, а не
  // останавливаться на зебре из-за пешехода.
  const insideNoStopZone = IX.some(ix => {
    const entry = ix.x - v.dir*(ZEBRA_OFF + NO_STOP_PAD);
    const exit = ix.x + v.dir*(ZEBRA_OFF + NO_STOP_PAD);
    return (front - entry)*v.dir > 0 && (exit - front)*v.dir > 0;
  });
  if(!insideNoStopZone){
    peds.forEach(p => {
      if(Math.abs(p.z) > 3.9) return;
      const d = (p.x - front)*v.dir;
      if(d > -.8 && d < 7) dist = Math.min(dist, d - 1.0);
    });
  }
  return dist;
}
function drive(v, dist, wdt, accel, decel, speedScale = 1){
  const maxSpeed = v.max * speedScale;
  const target = dist <= .35 ? 0 : Math.min(maxSpeed, Math.sqrt(2*BRAKE_A*Math.max(0, dist-.35)) * speedScale);
  v.prevSpeed = v.speed;
  v.speed = target > v.speed ? Math.min(target, v.speed + accel*speedScale*wdt) : Math.max(target, v.speed - decel*speedScale*wdt);
  v.x += v.dir*v.speed*wdt;
}
function doorWorld(b){
  return {
    x: b.x + (b.dir < 0 ? -1.55 : 1.55),
    z: b.z + (b.dir < 0 ? -1.15 : 1.15)
  };
}

/* Балл пробок → поведение потока:
   10 — почти стоим в пробке, 0 — пустая дорога (≈1 машина в минуту). */
function trafficSpeedFactor(){
  return clamp(1 - trafficScore * 0.098, 0.02, 1);
}
function trafficSpawnFactor(){
  return lerp(7, 0.25, trafficScore / 10) / Math.max(0.5, VIS.flow);
}
function trafficCarTarget(){
  const base = CAR_MIN + (CAR_MAX - CAR_MIN) * (trafficScore / 10);
  return clamp(Math.round(base + rand(-1, 1)), 1, CAR_MAX);
}

function step(wdt, dt){
  simTime += wdt;

  // Скорость потока плавно «дышит» по настройкам из кода.
  const jam = trafficSpeedFactor();
  const speedWave = (1 + SPEED_WAVE_AMP * Math.sin(simTime * SPEED_WAVE_FREQ)) * jam;

  // Плотность трафика меняется в случайном порядке.
  trafficTimer -= wdt;
  if(trafficTimer <= 0){
    trafficDensity = rand(TRAFFIC_MIN, TRAFFIC_MAX) * VIS.flow;
    trafficTimer = rand(TRAFFIC_TIME_MIN, TRAFFIC_TIME_MAX) * trafficSpawnFactor();
  }

  updateEffects(wdt);

  // Количество машин и ожидающих пешеходов — тоже случайное.
  countTimer -= wdt;
  if(countTimer <= 0){
    // Пробки ⇒ больше машин; дождь/снег ⇒ меньше пешеходов, солнце ⇒ больше.
    carTarget = trafficCarTarget();

    const badWeather = (weatherData && weatherData.precipitation > 0) || VIS.precipitation > 0.1;
    const sunny = weatherData && weatherData.weatherCode === 0 && !badWeather;
    const pedFactor = badWeather ? 0.3 : sunny ? 1.5 : 1;
    pedTarget = clamp(Math.round(rand(PED_MIN, PED_MAX) * pedFactor), PED_MIN, PED_MAX);
    countTimer = rand(COUNT_TIME_MIN, COUNT_TIME_MAX);
  }

  IX.forEach((ix,i) => {
    const st = pedLightState(ix, simTime);
    // Пешеходы подходят к переходу и ждут зелёный; часть подходит уже
    // к началу зелёной фазы.
    if(st === 'r' && prevState[i] !== 'r' && Math.random() < .65){
      spawnPed(ix); if(Math.random() < .4) spawnPed(ix);
    } else if(st === 'g' && prevState[i] !== 'g' && Math.random() < .5){
      spawnPed(ix);
    }
    prevState[i] = st;
  });
  lights.forEach(l => {
    const st = pedLightState(IX[l.ixIdx], simTime);
    ['r','y','g'].forEach(k => l.bulbs[k].forEach(b => b.material = bulbMats[k][k === st ? 'on' : 'off']));
    l.glow.material.color.setHex(BULB_C[st]); l.glow.position.y = BULB_Y[st];
  });
  carLights.forEach(l => {
    const st = lightState(IX[l.ixIdx], simTime);
    ['r','y','g'].forEach(k => l.bulbs[k].forEach(b => b.material = bulbMats[k][k === st ? 'on' : 'off']));
    l.glow.material.color.setHex(BULB_C[st]); l.glow.position.y = CAR_BULB_Y[st];
  });

  [1,-1].forEach((dir,i) => {
    spawnT[i] -= wdt;
    if(spawnT[i] <= 0){
      const spawned = trafficEnabled && cars.length < carTarget ? spawnCar(dir) : false;
      spawnT[i] = spawned ? rand(2.2,4.4)/trafficDensity : .6;
    }
  });
  if(CFG.buses && trafficEnabled){
    busSpawnT -= wdt;
    if(busSpawnT <= 0) busSpawnT = spawnBus() ? rand(30,46)/trafficDensity : 3;
  }

  for(let i=cars.length-1; i>=0; i--){
    const c = cars[i];
    const front = c.x + c.dir*(c.len/2);
    drive(c, trafficEnabled ? vehicleObstacleDist(c, front) : 0, wdt, ACCEL, DECEL, speedWave);
    c.g.position.set(c.x, 0, c.z);
    const acc = wdt > 0 ? (c.speed - c.prevSpeed)/wdt : 0;
    c.bodyG.rotation.z = lerp(c.bodyG.rotation.z, clamp(acc*.006,-.05,.05)*c.dir, .12);
    c.bodyG.position.y = Math.sin(simTime*6 + c.seed)*.012;
    if(Math.abs(c.x) > ROAD_HALF+3) despawnCar(c);
  }

  // Автобусы ходят в обе стороны и останавливаются у своей остановки.
  for(let i=buses.length-1; i>=0; i--){
    const b = buses[i];
    const front = b.x + b.dir*(b.len/2);
    const ahead = (b.stopX - b.x) * b.dir;   // расстояние до остановки по ходу
    const nearStop = Math.abs(b.x - b.stopX) < 8;
    let zTarget = b.laneZ;

    if(b.state === 'run'){
      let dist = trafficEnabled ? vehicleObstacleDist(b, front) : 0;
      if(b.willStop && ahead > -.3){
        if(ahead < 15) zTarget = b.bayZ;
        if(ahead > 0) dist = Math.min(dist, Math.max(0, ahead));
      }
      drive(b, dist, wdt, 2.2, 6, speedWave);
      if(b.willStop && Math.abs(b.x - b.stopX) < .35 && b.speed < .25){
        b.x = b.stopX; b.speed = 0; b.state = 'dwell'; b.dwellT = 0; b.boardTimer = .7;
        const n = Math.random() < .3 ? 0 : (Math.random() < .6 ? 1 : 2);
        for(let k=0;k<n;k++){
          const dw = doorWorld(b);
          const p = spawnStopPed('alight', dw.x + rand(-.2,.2), dw.z, b.side);
          if(p) p.speed = rand(1.5,1.9);
        }
        flashBus(`Автобус на остановке «${b.routeName}»`);
      }
    }
    else if(b.state === 'dwell'){
      zTarget = b.bayZ; b.speed = 0;
      b.doorT = Math.min(1, b.doorT + wdt*2.5);
      b.dwellT += wdt;
      if(b.doorT > .8){
        b.boardTimer -= wdt;
        if(b.boardTimer <= 0){
          const idle = stopPeds.filter(p => p.state === 'idle' && p.side === b.side);
          if(idle.length){
            const dw = doorWorld(b);
            idle.sort((a,c) => Math.abs(a.x-dw.x) - Math.abs(c.x-dw.x));
            idle[0].state = 'toBus'; idle[0].bus = b;
            b.boardTimer = .8;
          }
        }
      }
      const busy = stopPeds.some(p => p.bus === b && (p.state === 'toBus' || p.state === 'board'));
      const idleLeft = stopPeds.some(p => p.state === 'idle' && p.side === b.side);
      if(b.dwellT > 2.4 && !busy && (!idleLeft || b.dwellT > 9)) b.state = 'close';
    }
    else if(b.state === 'close'){
      zTarget = b.bayZ; b.speed = 0;
      b.doorT = Math.max(0, b.doorT - wdt*2.5);
      if(b.doorT <= .05){ b.state = 'leave'; b.willStop = false; flashBus('Автобус отправляется'); }
    }
    else if(b.state === 'leave'){
      let dist = trafficEnabled ? vehicleObstacleDist(b, front) : 0;
      if(nearStop && cars.some(c => c.dir === b.dir && Math.abs(c.x - b.x) < 5.5)) dist = Math.min(dist, 0);
      zTarget = nearStop ? b.bayZ : b.laneZ;
      drive(b, dist, wdt, 2.0, 6, speedWave);
      if(ahead < -16) b.state = 'run';
    }

    b.z = lerp(b.z, zTarget, Math.min(1, wdt*1.6));
    b.g.position.set(b.x, 0, b.z);
    b.doorL.position.x = 1.28 - b.doorT*.3;
    b.doorR.position.x = 1.82 + b.doorT*.3;
    const acc = wdt > 0 ? (b.speed - b.prevSpeed)/wdt : 0;
    b.bodyG.rotation.z = lerp(b.bodyG.rotation.z, clamp(acc*.004,-.03,.03), .1);
    b.bodyG.position.y = Math.sin(simTime*5 + b.seed)*.01;
    if(b.dir < 0 ? b.x < -(ROAD_HALF+4) : b.x > ROAD_HALF+4) despawnBus(b);
  }

  for(let i=peds.length-1; i>=0; i--){
    const p = peds[i];
    const light = p.ix ? pedLightState(p.ix, simTime) : 'r';

    // Ждём на тротуаре, пока для пешеходов не загорится зелёный.
    if(p.state === 'wait'){
      p.g.position.set(p.x, Math.abs(Math.sin(simTime*3+p.seed))*.015, p.z);
      p.g.rotation.y = p.dz > 0 ? 0 : Math.PI;
      if(light === 'g' && crosswalkClear(p)) p.state = 'cross';
      continue;
    }

    // Переходим на зелёный; если красный застал на переходе — ускоряемся,
    // чтобы освободить дорогу.
    const hurry = light === 'g' ? 1 : 1.7;
    p.z += p.dz*p.speed*hurry*wdt;
    p.g.position.set(p.x, Math.abs(Math.sin(simTime*8+p.seed))*.05, p.z);
    p.g.rotation.y = p.dz > 0 ? 0 : Math.PI;
    if(Math.abs(p.z) > 5.5){ p.active = false; p.g.visible = false; peds.splice(i,1); }
  }

  const waiting = stopPeds.filter(p => p.state === 'in' || p.state === 'idle').length;
  pedSpawnT -= wdt;
  if(pedSpawnT <= 0){
    pedSpawnT = rand(4,8);
    if(waiting < pedTarget){
      const fromLeft = Math.random() < .5;
      const side = Math.random() < .5 ? -1 : 1;
      const home = side < 0 ? SHELTER_X : SHELTER2_X;
      spawnStopPed(
        'in',
        home + (fromLeft ? -1 : 1)*rand(16,24),
        side < 0 ? -5.0 : 5.0,
        side
      );
    }
  }
  for(let i=stopPeds.length-1; i>=0; i--){
    const p = stopPeds[i];
    let bob = Math.abs(Math.sin(simTime*7+p.seed))*.04;
    if(p.state === 'in'){
      const d = movePed(p, p.tx, sidewalkZ(p.x, p.side), p.speed, wdt);
      if(d < .25){ p.state = 'idle'; }
    }
    else if(p.state === 'idle'){
      bob = Math.sin(simTime*2+p.seed)*.015 + .015;
      p.g.rotation.y = Math.sin(simTime*.7+p.seed)*.3;
    }
    else if(p.state === 'toBus'){
      if(!p.bus || !p.bus.active || p.bus.state === 'leave'){ p.state = 'idle'; p.bus = null; }
      else {
        const dw = doorWorld(p.bus);
        const d = movePed(p, dw.x, dw.z, 1.9, wdt);
        if(d < .3){ p.state = 'board'; p.boardT = 0; }
      }
    }
    else if(p.state === 'board'){
      p.boardT += wdt;
      const k = clamp(1 - p.boardT/.35, 0, 1);
      p.g.scale.setScalar(k);
      if(p.bus) p.z = lerp(p.z, p.bus.z - .5, Math.min(1, wdt*6));
      bob = 0;
      if(k <= 0){ despawnStopPed(p); continue; }
    }
    else if(p.state === 'alight'){
      const d = movePed(p, p.tx, sidewalkZ(p.x, p.side), p.speed, wdt);
      if(d < .3){ p.state = 'out'; }
    }
    else if(p.state === 'out'){
      p.x += p.outDir*p.speed*wdt;
      p.z = lerp(p.z, sidewalkZ(p.x, p.side), Math.min(1, wdt*3));
      p.g.rotation.y = p.outDir > 0 ? Math.PI/2 : -Math.PI/2;
      if(Math.abs(p.x - p.homeX) > 26){ despawnStopPed(p); continue; }
    }
    p.g.position.set(p.x, bob, p.z);
  }

  clouds.forEach(cl => { cl.position.x += .4*dt; if(cl.position.x > 75) cl.position.x = -75; });
}

function setMode(mode){
  CFG.mode = mode;
  camFrom = { pos:camera.position.clone(), tgt:curTgt.clone(), zoom:camera.zoom };
  camTo = CAM[mode]; camT = 0;
  // Осадки привязаны к точке views — в любой проекции дождь виден сразу.
  if (precip) buildPrecip();
  resize();
  dirty = true;
}
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  if(!w || !h) return;
  const aspect = w/h;
  const baseHalfW = clamp(Math.max(15*aspect, camTo.minH*aspect), 32, 78);
  const halfW = baseHalfW / CAM_SCALE, halfH = halfW/aspect;
  camera.left = -halfW; camera.right = halfW; camera.top = halfH; camera.bottom = -halfH;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio({ eco:1, balanced:1.5, max:Math.min(devicePixelRatio,2) }[CFG.quality]);
  renderer.setSize(w, h, false);
  dirty = true;
}
new ResizeObserver(resize).observe(stage);

const tanks = [];
function buildTank(dir, z){
  const g = new THREE.Group();
  const green = new THREE.MeshStandardMaterial({ color:0x4a5f39, roughness:.85, flatShading:true });
  const dark = new THREE.MeshStandardMaterial({ color:0x2f3d26, roughness:.9, flatShading:true });
  const body = new THREE.Mesh(new THREE.BoxGeometry(4.4,.9,1.9), green); body.position.y = .85; g.add(body);
  const turret = new THREE.Mesh(new THREE.CylinderGeometry(.85,.95,.6,8), green); turret.position.set(-.2,1.55,0); g.add(turret);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(.11,.13,3.1,8), dark);
  barrel.rotation.z = Math.PI/2; barrel.position.set(1.9,1.55,0); g.add(barrel);
  [-1,1].forEach(sz => {
    const track = new THREE.Mesh(new THREE.BoxGeometry(4.5,.5,.42), dark);
    track.position.set(0,.42,sz*.88); g.add(track);
  });
  g.rotation.y = dir > 0 ? 0 : Math.PI;
  scene.add(g);
  const tank = { g, dir, z, x: dir > 0 ? -ROAD_HALF-8 : ROAD_HALF+8, speed:6.5 };
  g.position.set(tank.x,0,z); tanks.push(tank);
}

function tankHoliday(){

/* Осадки: одна система частиц на всё, вид зависит от погоды. */
let precip = null;
function buildPrecip() {
  if(precip){
    fxGroup.remove(precip);
    precip.geometry.dispose();
    precip.material.dispose();
    precip = null;
  }

  const snowy = VIS.weatherPreset === 'snow' || VIS.decoSnowfall;
  const amount = clamp(Math.max(VIS.precipitation, VIS.decoSnowfall ? 0.5 : 0), 0, 1);
  if(amount <= 0) return;

  // Дождя больше и он мельче; снег — редкие крупные снежинки.
  const count = Math.floor(
    (snowy ? 180 : 300) + (snowy ? 420 : 800) * amount * VIS.decorDensity
  );
  const pos = new Float32Array(count * 3);
  for(let i=0;i<count;i++){
    // Частицы вокруг текущей точки камеры, а не вокруг начала координат —
    // дождь одинаково виден в изометрии, сверху, спереди и у остановки.
    pos[i*3] = curTgt.x + rand(-45,45);
    pos[i*3+1] = rand(2,45);
    pos[i*3+2] = curTgt.z + rand(-32,32);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({
    map: snowy ? snowflake : rainStreak,
    color: snowy ? 0xffffff : 0xdaf1ff,
    size: snowy ? 1.8 : 1.05,
    transparent: true,
    alphaTest: 0.02,
    opacity: snowy ? 0.95 : 0.75,
    depthWrite: false,
    sizeAttenuation: true,
    fog: false
  });
  precip = new THREE.Points(geo, mat);
  precip.userData.snowy = snowy;
  fxGroup.add(precip);
}

function updateEffects(dt) {
  if(precip){
    const arr = precip.geometry.attributes.position.array;
    const snowy = precip.userData.snowy;
    const fall = (snowy ? 3.2 : 24) * dt;
    const drift = VIS.wind * (snowy ? 1.8 : 0.9) * dt;
    for(let i=0;i<arr.length;i+=3){
      arr[i+1] -= fall * (0.7 + (i % 9) * 0.07);
      // Снежинки покачиваются, дождь идёт под лёгким углом ветра.
      arr[i] += drift + (snowy ? Math.sin(simTime * 0.9 + i) * 0.012 : 0);
      if(arr[i+1] < 0.5){
        arr[i+1] = 45;
        arr[i] = curTgt.x + rand(-45,45);
        arr[i+2] = curTgt.z + rand(-32,32);
      }
      if(arr[i] > curTgt.x + 75) arr[i] -= 150;
    }
    precip.geometry.attributes.position.needsUpdate = true;
  }

  // Танки едут только в «23 февраля» и «9 Мая».
  const showTanks = tankHoliday();
  tanks.forEach(t => {
    t.g.visible = showTanks;
    if(!showTanks) return;
    t.x += t.dir * t.speed * dt;
    if(t.dir > 0 && t.x > ROAD_HALF+8) t.x = -ROAD_HALF-8;
    if(t.dir < 0 && t.x < -ROAD_HALF-8) t.x = ROAD_HALF+8;
    t.g.position.x = t.x;
  });

  // Двое гуляют по тротуару, сердечко над ними покачивается.
  if(loversGroup && loversGroup.visible){
    loversGroup.position.x += 1.0 * dt;
    if(loversGroup.position.x > 55) loversGroup.position.x = -55;
    if(loverHeart) loverHeart.position.y = 2.05 + Math.sin(simTime * 2.4) * .15;
  }

  // Сани с оленями летят над сценой и мягко покачиваются.
  if(sleighGroup && sleighGroup.visible){
    sleighGroup.position.x += 2.6 * dt;
    if(sleighGroup.position.x > 84) sleighGroup.position.x = -84;
    sleighGroup.position.y = 14 + Math.sin(simTime * .8) * .6;
  }

  if(lightning && VIS.lightning > 0 && VIS.weatherPreset === 'storm'){
    if(Math.random() < dt * VIS.lightning * 0.25) lightning.intensity = 3.5;
  }
  if(lightning) lightning.intensity = Math.max(0, lightning.intensity - dt * 12);
}

/* ================= АКТИВНЫЙ СЦЕНАРИЙ ================= */
/* Сценарий из чата/админки применяются поверх настроек, а после завершения
   страница перезагружается — и баннер снова берёт код из БД. */
let activeScenarioId = null;
let activeScenarioStart = 0;
let lastScenarioMessageAt = 0;
let scenarioTimers = [];
let scenarioNight = null;
// Сценарий может остановить/возобновить поток машин и автобусов.
let trafficEnabled = true;

/* Состояние до применённого сценария. При переходе к новой сцене всё
   восстанавливается из него, чтобы флаги прошлой сцены (сугробы, снег,
   праздники, туман и т.п.) не перекочевывали в следующую. */
const BASE_VIS = { ...VIS };
const BASE_LIVE = { ...LIVE };
const BASE_CFG = { ...CFG };
const BASE_THEME_T = themeT;
const BASE_DAY_PHASE = dayPhase;
const BASE_TRAFFIC_DENSITY = trafficDensity;
const BASE_TRAFFIC_TIMER = trafficTimer;
const BASE_CAR_TARGET = carTarget;
const BASE_PED_TARGET = pedTarget;
const BASE_COUNT_TIMER = countTimer;
const BASE_SPAWN_T = [...spawnT];
const BASE_BUS_SPAWN_T = busSpawnT;
const BASE_PED_SPAWN_T = pedSpawnT;

function resetSceneState() {
  Object.assign(VIS, BASE_VIS);
  Object.assign(LIVE, BASE_LIVE);
  Object.assign(CFG, BASE_CFG);
  IX.forEach(ix => { ix.forcePhase = null; });
  scenarioNight = null;
  trafficEnabled = true;
  themeT = BASE_THEME_T;
  dayPhase = BASE_DAY_PHASE;
  trafficDensity = BASE_TRAFFIC_DENSITY;
  trafficTimer = BASE_TRAFFIC_TIMER;
  carTarget = BASE_CAR_TARGET;
  pedTarget = BASE_PED_TARGET;
  countTimer = BASE_COUNT_TIMER;
  spawnT.splice(0, spawnT.length, ...BASE_SPAWN_T);
  busSpawnT = BASE_BUS_SPAWN_T;
  pedSpawnT = BASE_PED_SPAWN_T;
  if(lightning) lightning.intensity = 0;
  applyTheme(themeT);
  applyFog();
  presetWeather();
  buildPrecip();
  syncDecor();
  updateHolidayHUD();
  dirty = true;
}

function _carMaterial(color) {
  const str = String(color || '').trim();
  const hex = str.startsWith('#') ? parseInt(str.slice(1), 16) : NaN;
  if (!Number.isFinite(hex)) return null;
  return carMats.find(m => m.color.getHex() === hex) || null;
}

function applyScenarioEvent(event) {
  const p = event.params || {};

  switch (event.do) {
    case 'change_speed':
      VIS.speed = clamp(Number(p.factor) || 1, 0.2, 2);
      break;
    case 'change_traffic_density':
      VIS.flow = clamp(Number(p.density) || 1, 0.5, 3);
      break;
    case 'start_traffic':
      trafficEnabled = true;
      break;
    case 'stop_traffic':
      trafficEnabled = false;
      break;
    case 'add_car':
    case 'add_vehicle': {
      const dir = Number(p.dir) === -1 ? -1 : 1;
      let spawned = false;
      // Обычный спавн может не пройти из-за соседней машины — пробуем
      // несколько свободных точек по дороге, чтобы сценарий гарантированно
      // добавил транспорт.
      for (let attempt = 0; attempt < 8 && !spawned; attempt++) {
        spawned = spawnCar(dir, attempt ? rand(-ROAD_HALF, ROAD_HALF) : undefined);
      }
      if (spawned) {
        const mat = _carMaterial(p.color || p.colour);
        if (mat) cars[cars.length - 1].body.material = mat;
      }
      break;
    }
    case 'remove_car':
    case 'remove_vehicle': {
      if (String(p.type || '').toLowerCase() === 'bus' && buses.length) {
        despawnBus(buses[buses.length - 1]);
        break;
      }
      if (!cars.length) break;
      const mat = _carMaterial(p.color || p.colour);
      const target = mat
        ? cars.find(c => c.body.material === mat)
        : cars[cars.length - 1];
      if (target) despawnCar(target);
      break;
    }
    case 'add_bus': {
      // Пул из двух автобусов; если оба на маршруте — убираем самый старый,
      // чтобы сценарий всё равно добавил новый.
      if (buses.length && !busPool.some(b => !b.active)) despawnBus(buses[0]);
      spawnBus(Number.isFinite(Number(p.atX)) ? Number(p.atX) : undefined);
      break;
    }
    case 'remove_bus':
      if (buses.length) despawnBus(buses[buses.length - 1]);
      break;
    case 'add_pedestrian': {
      const dir = String(p.direction || '').toLowerCase();
      const idx = clamp(Math.round(Number(p.intersection) || 0), 0, IX.length - 1);
      if (dir === 'left' || dir === 'right') {
        const side = dir === 'right' ? 1 : -1;
        const home = side < 0 ? SHELTER_X : SHELTER2_X;
        spawnStopPed('in', home + (dir === 'left' ? -18 : 18), side < 0 ? -5 : 5, side);
      } else {
        spawnPed(IX[idx]);
      }
      break;
    }
    case 'remove_pedestrian':
      if (peds.length) {
        const target = peds[peds.length - 1];
        target.active = false;
        target.g.visible = false;
        peds.splice(peds.indexOf(target), 1);
      } else if (stopPeds.length) {
        despawnStopPed(stopPeds[stopPeds.length - 1]);
      }
      break;
    case 'change_traffic_light_phase': {
      const idx = clamp(Math.round(Number(p.intersection) || 0), 0, IX.length - 1);
      const names = { green:'g', yellow:'y', red:'r' };
      const state = names[String(p.phase || '').toLowerCase()] || 'r';
      const duration = clamp(Number(p.duration) || 10, 1, 120);
      IX[idx].forcePhase = { state, until: simTime + duration };
      break;
    }
    case 'change_weather': {
      const map = { clear:'clear', cloudy:'cloudy', rain:'rain', snow:'snow', fog:'fog', storm:'storm' };
      const w = map[String(p.condition || '').toLowerCase()] || 'clear';
      const savedNight = scenarioNight;
      VIS.weatherPreset = w;
      VIS.fog = w === 'fog' ? 0.85 : w === 'cloudy' ? 0.35 : 0;
      VIS.brightness = (w === 'fog' || w === 'cloudy') ? 0.75 : 1;
      VIS.precipitation = w === 'rain' ? 0.7
        : w === 'storm' ? 0.85
        : w === 'snow' ? 0.7 : 0;
      // Снег с предыдущего сценария не должен оставаться при смене погоды,
      // а молнии включаются только для грозы.
      VIS.decoSnowfall = w === 'snow';
      VIS.lightning = w === 'storm'
        ? clamp(Number(p.lightning) || 1, 0.2, 2) : 0;
      buildPrecip(); applyFog(); presetWeather(); syncDecor();
      if ((w === 'fog' || w === 'cloudy') && savedNight !== null) {
        scenarioNight = savedNight; themeT = savedNight; applyTheme(themeT);
      }
      break;
    }
    case 'start_rain':
      VIS.weatherPreset = 'rain';
      VIS.precipitation = clamp(Number(p.intensity) || 0.6, 0, 1);
      VIS.decoSnowfall = false; VIS.lightning = 0;
      VIS.fog = 0; applyFog();
      buildPrecip(); presetWeather(); syncDecor();
      break;
    case 'stop_rain':
    case 'stop_snow':
      VIS.precipitation = 0; VIS.decoSnowfall = false; VIS.lightning = 0;
      VIS.fog = 0; applyFog();
      buildPrecip(); syncDecor(); presetWeather();
      break;
    case 'start_snow':
      VIS.weatherPreset = 'snow'; VIS.decoSnowfall = true; VIS.lightning = 0;
      VIS.precipitation = clamp(Number(p.intensity) || 0.6, 0, 1);
      VIS.fog = 0; applyFog();
      buildPrecip(); syncDecor(); presetWeather();
      break;
    case 'add_holiday_decor': {
      const newYear = {
        decoTrees:true, decoSnowfall:true, decoSnowman:true,
        decoGarlands:true, decoStars:true, decoSnowdrifts:true, decoSleigh:true
      };
      const presets = {
        'new-year': newYear, 'christmas': newYear,
        'women-day': { decoFlowers:true, decoGarlands:true },
        'victory-day': { decoFlags:true },
        'defenders-day': { decoFlags:true },
        'russia-day': { decoFlags:true, decoGarlands:true },
        'valentines-day': { decoHearts:true },
        'valentine': { decoHearts:true },
        'heart': { decoHearts:true },
        'trees': { decoTrees:true },
        'snowman': { decoSnowman:true },
        'snow': { decoSnowfall:true },
        'snowdrifts': { decoSnowdrifts:true },
        'sleigh': { decoSleigh:true },
        'flowers': { decoFlowers:true },
        'flags': { decoFlags:true },
        'balloons': { decoGarlands:true, decoStars:true },
        'confetti': { decoStars:true },
        'stars': { decoStars:true }
      };
      const type = String(p.type || '').toLowerCase();
      Object.assign(VIS, presets[type] || {});
      VIS.holidayPreset = type || 'custom';
      syncDecor(); updateHolidayHUD();
      break;
    }
    case 'remove_holiday_decor':
      decoKeys.forEach(k => { VIS[k] = false; });
      VIS.holidayPreset = 'none';
      syncDecor(); updateHolidayHUD();
      break;
    case 'change_time_of_day': {
      const phases = { morning:0.15, day:0, evening:0.7, night:1 };
      scenarioNight = phases[p.phase] ?? 0;
      LIVE.time = false;
      themeT = scenarioNight;
      applyTheme(themeT);
      break;
    }
    case 'end':
      finishScenario();
      break;
  }

  dirty = true;
}

function clearScenarioTimers() {
  scenarioTimers.forEach(clearTimeout);
  scenarioTimers = [];
}

function finishScenario() {
  clearScenarioTimers();
  activeScenarioId = null;
  activeScenarioStart = 0;
  scenarioNight = null;
  // Возврат к поведению по умолчанию, прописанному в БД: перезагружаем
  // документ, и он снова берёт код из home_slides.code.
  location.reload();
}

function startScenario(payload) {
  // Сценарий из умного чата выполняется независимо от ручного режима:
  // после завершения страница перезагрузится и вернётся к код БД.
  const state = payload || {};
  const scenario = state.scenario || {};
  const id = scenario.id || 'scenario';
  const start = Number(state.started_at || 0) * 1000;

  // Тот же сценарий, запущенный заново, должен перезапуститься; повторный
  // опрос уже применённого состояния ничего не ломает. Устаревший ответ
  // опроса не должен откатывать только что применённый сценарий.
  if (activeScenarioId === id && activeScenarioStart === start) return;
  if (activeScenarioId && start < activeScenarioStart) return;

  clearScenarioTimers();
  // Новая сцена начинается с чистого состояния, без «хвостов» предыдущей.
  resetSceneState();
  activeScenarioId = id;
  activeScenarioStart = start;

  const offset = start ? Math.max(0, Date.now() - start) : 0;

  (scenario.events || [])
    .slice()
    .sort((a, b) => Number(a.t) - Number(b.t))
    .forEach(event => {
      const delay = Math.max(0, Number(event.t) * 1000 - offset);
      scenarioTimers.push(setTimeout(() => applyScenarioEvent(event), delay));
    });

  dirty = true;
  // Если сцена стоит на паузе, перерисовываем кадр сразу.
  if (CFG.paused) renderer.render(scene, camera);
  // Подтверждение родителю (баннер в sandbox-iframe): сценарий принят.
  // Родитель не может заглянуть внутрь cross-origin iframe, поэтому
  // единственный способ убедиться — ответное сообщение.
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(
        { type: 'albion-roadrunner-ack', id, startedAt: start },
        '*'
      );
    }
  } catch (exc) {
    /* postMessage недоступен — не критично */
  }
}

/* Мгновенное применение из умного чата: сообщение приходит по
   BroadcastChannel (между вкладками/iframe) или через postMessage
   от RoadBannerSlide. Опрос ниже остаётся страховкой. */
function applyScenarioMessage(message) {
  if (!message) return;
  lastScenarioMessageAt = Date.now();
  if (message.type === 'scenario' && message.payload) {
    startScenario(message.payload);
  } else if (message.type === 'clear') {
    finishScenario();
  }
}

let scenarioChannel = null;
try {
  if (typeof BroadcastChannel !== 'undefined') {
    scenarioChannel = new BroadcastChannel('albion-roadrunner');
    scenarioChannel.onmessage = event => applyScenarioMessage(event.data);
  }
} catch (exc) {
  console.warn('BroadcastChannel недоступен, остаётся опрос сценария:', exc);
}

window.addEventListener('message', event => {
  const message = event.data;
  if (message && message.type === 'albion-roadrunner') {
    applyScenarioMessage({ type: 'scenario', payload: message.payload });
  }
});

async function pollActiveScenario() {
  try {
    const response = await fetch('/api/roadrunner/scenarios/active');
    if (!response.ok) return;
    const data = await response.json();

    if (data.active) {
      startScenario(data.active);
    } else if (
      activeScenarioId &&
      Date.now() - lastScenarioMessageAt > 3000
    ) {
      finishScenario();
    }
  } catch (exc) {
    console.warn('Не удалось проверить активный сценарий:', exc);
  }
}

/* Сезонная модель — запасной вариант, когда синхронизация выключена или
   API недоступен. Значения детерминированы по часу, как и на бэкенде. */
function modelWeather() {
  const now = new Date();
  const month = now.getMonth() + 1;
  const hour = now.getHours();
  const seed = now.getFullYear() * 1000000 + month * 10000 + now.getDate() * 100 + hour;
  const noise = mod => (seed * 2654435761) % mod;

  const baseTemp = {
    12: 5, 1: 3, 2: 5, 3: 10, 4: 15, 5: 20,
    6: 25, 7: 28, 8: 27, 9: 22, 10: 15, 11: 8
  }[month] || 15;
  let offset = 0;
  if (hour >= 6 && hour <= 9) offset = -3;
  else if (hour >= 12 && hour <= 15) offset = 3;
  else if (hour >= 18 && hour <= 21) offset = -2;

  let weatherCode = 1;
  if ([11, 12, 1, 2].includes(month)) weatherCode = noise(3) === 0 ? 71 : 3;
  else if ([6, 7, 8].includes(month)) weatherCode = noise(4) === 0 ? 51 : 0;
  else weatherCode = noise(2) === 0 ? 3 : 0;

  weatherData = {
    temperature: baseTemp + offset + (noise(5) - 2),
    humidity: 50 + noise(30),
    windSpeed: 5 + noise(20),
    precipitation: weatherCode >= 51 && weatherCode < 80 ? 0.4 : 0,
    weatherCode
  };
  weatherSource = 'модель';
  if (VIS.weatherPreset === 'auto' && LIVE.weather) {
    VIS.precipitation = weatherData.precipitation;
    buildPrecip();
  }
  updateWeatherHUD();
}

/* Ручной пресет погоды из админки перекрывает реальные данные. */
function presetWeather() {
  const preset = VIS.weatherPreset;
  const codes = { clear:0, snow:71, rain:51, storm:95, night:0 };
  const nightByPreset = { clear:0, snow:0.25, rain:0.45, storm:0.8, night:1 };

  // Пресет перекрывает реальное время суток: «Ясно» — светлый день,
  // «Ночь» — тёмная сцена. В режиме «Реальная» тема снова идёт по часам.
  if (preset === 'auto') {
    scenarioNight = null;
    LIVE.time = true;
  } else {
    scenarioNight = nightByPreset[preset] ?? 0;
    LIVE.time = false;
    themeT = scenarioNight;
    applyTheme(themeT);
  }

  weatherData = {
    temperature: preset === 'snow' ? -4 : preset === 'night' ? 8 : 18,
    humidity: preset === 'clear' ? 45 : 85,
    windSpeed: VIS.wind * 18,
    precipitation: VIS.precipitation,
    weatherCode: codes[preset] ?? 0
  };
  weatherSource = 'пресет';
  applyFog();
  updateWeatherHUD();
}

function weatherCodeToEmoji(code, temperature, isNight) {
  const warm = Number(temperature) > 2;

  if (code === 0) return isNight ? '🌙' : '☀️';
  if (code <= 3) return isNight ? '🌙' : '⛅';
  if (code <= 48) return '🌫️';
  if (code <= 67) return '🌧️';
  if (code <= 77) return warm ? '🌧️' : '❄️';   // снег только при минусе
  if (code <= 82) return '🌦️';
  if (code <= 86) return warm ? '🌧️' : '🌨️';
  return '⛈️'; // гроза
}

function weatherCodeToText(code) {
  if (code === 0) return 'солнце';
  if (code <= 3) return 'облачно';
  if (code <= 48) return 'туман';
  if (code <= 67) return 'дождь';
  if (code <= 77) return 'снег';
  if (code <= 82) return 'ливень';
  if (code <= 86) return 'снегопад';
  return 'гроза';
}

/* Шкала Яндекс.Пробок: 0-3 свободно, 4-6 умеренно, 7-9 пробки, 10 затор. */
function trafficLevel(score) {
  if (score <= 3) return { level: 'free', label: 'свободно' };
  if (score <= 6) return { level: 'moderate', label: 'умеренно' };
  if (score <= 9) return { level: 'jam', label: 'пробки' };
  return { level: 'gridlock', label: 'затор' };
}

function modelTraffic() {
  const hour = new Date().getHours();
  let score = 2;
  if (hour >= 7 && hour <= 10) score = 7;
  else if (hour >= 17 && hour <= 20) score = 8;
  else if (hour > 10 && hour < 17) score = 4;

  trafficScore = score;
  trafficData = { score, ...trafficLevel(score) };
  trafficSource = 'модель';
  if (LIVE.traffic) {
    VIS.flow = clamp(0.55 + score * 0.15, 0.5, 3);
    dirty = true;
  }
  updateTrafficHUD();
}

async function fetchTraffic() {
  if (!LIVE.traffic) {
    modelTraffic();

  try {
    const response = await fetch('/api/roadrunner/traffic');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    const score = Math.max(0, Math.min(10, Number(data.data?.score || 0)));
    trafficScore = score;

    trafficData = {
      score,
      ...trafficLevel(score),
      label: data.data?.label || trafficLevel(score).label
    };
    trafficSource = data.data?.source || 'яндекс';
    // Балл пробок управляет плотностью потока: 10 баллов — максимум машин.

    updateTrafficHUD();

    console.warn('Пробки не загружены, используется модель:', exc);
    modelTraffic();
  }
}

/* Восход и закат для координат Ростова-на-Дону (NOAA-приближение).
   Возвращает местное время в часах с дробной частью. */
function sunTimesFor(date) {
  const lat = CITY_CONFIG.lat, lon = CITY_CONFIG.lon;
  const rad = Math.PI / 180;
  const year = date.getFullYear();
  const dayOfYear = Math.floor(
    (Date.UTC(year, date.getMonth(), date.getDate()) - Date.UTC(year, 0, 0)) / 86400000
  );
  const gamma = (2 * Math.PI / 365) * (dayOfYear - 1);

  const eqTime = 229.18 * (
    0.000075 + 0.001868 * Math.cos(gamma) - 0.032077 * Math.sin(gamma)
    - 0.014615 * Math.cos(2 * gamma) - 0.040849 * Math.sin(2 * gamma)
  );
  const decl = (
    0.006918 - 0.399912 * Math.cos(gamma) + 0.070257 * Math.sin(gamma)
    - 0.006758 * Math.cos(2 * gamma) + 0.000907 * Math.sin(2 * gamma)
    - 0.002697 * Math.cos(3 * gamma) + 0.00148 * Math.sin(3 * gamma)
  );

  const cosH = Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(decl))
    - Math.tan(lat * rad) * Math.tan(decl);

  if (cosH > 1) return { sunrise: 0, sunset: 24 };   // полярная ночь
  if (cosH < -1) return { sunrise: 12, sunset: 12 }; // полярный день

  const ha = Math.acos(cosH) / rad;
  const sunriseUTC = 720 - 4 * (lon + ha) - eqTime;
  const sunsetUTC = 720 - 4 * (lon - ha) - eqTime;

  const toLocal = minutes => {
    const d = new Date(Date.UTC(year, date.getMonth(), date.getDate(), 0, minutes));
    return d.getHours() + d.getMinutes() / 60;
  };

  return { sunrise: toLocal(sunriseUTC), sunset: toLocal(sunsetUTC) };
}

/* Тема дня/ночи по реальному восходу/закату (0 — день, 1 — ночь). */
function realNightFactor() {
  const now = new Date();
  const hour = now.getHours() + now.getMinutes() / 60;
  const { sunrise, sunset } = sunTimesFor(now);
  const twilight = 1.2; // часа на плавный переход

  if (hour >= sunrise + twilight && hour <= sunset - twilight) return 0;
  if (hour >= sunset + twilight || hour <= sunrise - twilight) return 1;
  if (hour < sunrise + twilight) {
    return clamp((sunrise + twilight - hour) / (2 * twilight), 0, 1);
  }
  return clamp((hour - (sunset - twilight)) / (2 * twilight), 0, 1);
}

const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;

function loop(now){
  requestAnimationFrame(loop);
  const dt = clamp((now-last)/1000, 0, .05); last = now;
  if(!inView || document.hidden) return;

  let animating = false;
  if(!RM){
    // По умолчанию тема следует реальному времени суток; при выключенной
    // синхронизации остаётся декоративный цикл за DAY_NIGHT_PERIOD секунд.
    let night;
    if(scenarioNight !== null){
      night = scenarioNight;
    } else if(LIVE.time){
      night = realNightFactor();
    } else {
      dayPhase = (dayPhase + dt / DAY_NIGHT_PERIOD) % 1;
      night = 0.5 - 0.5 * Math.cos(dayPhase * Math.PI * 2);
    }
    if(Math.abs(night - themeT) > 0.0005){
      const wasNight = themeT > 0.5;
      themeT = night;
      applyTheme(themeT);
      // Иконка погоды меняется на луну/солнце при смене дня и ночи.
      if((night > 0.5) !== wasNight) updateWeatherHUD();
      animating = true;
    }
  }
  if(camT < 1){
    camT = Math.min(1, camT + dt/1.4);
    const k = ease(camT);
    camera.position.lerpVectors(camFrom.pos, camTo.pos, k);
    curTgt.lerpVectors(camFrom.tgt, camTo.tgt, k);
    camera.zoom = lerp(camFrom.zoom, camTo.zoom, k);
    camera.updateProjectionMatrix();
    animating = true;
  }
  parallax.x = lerp(parallax.x, CFG.parallax && !RM ? parallax.tx : 0, Math.min(1, dt*4));
  parallax.y = lerp(parallax.y, CFG.parallax && !RM ? parallax.ty : 0, Math.min(1, dt*4));
  camera.position.x += parallax.x; camera.position.y += parallax.y;
  camera.lookAt(curTgt.x + parallax.x*.6, curTgt.y + parallax.y*.6, curTgt.z);

  if(!CFG.paused){ step(dt * VIS.speed, dt); renderer.render(scene, camera); frames++; }
  else if(animating || dirty){ renderer.render(scene, camera); frames++; dirty = false; }

}

/* ================= ОЧИСТКА ================= */
function dispose(){
  clearTimeout(flashT);
  scene.traverse(o => {
    if(o.geometry) o.geometry.dispose();
    if(o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if(m.map) m.map.dispose(); if(m.emissiveMap) m.emissiveMap.dispose(); m.dispose(); });
  });
  renderer.dispose();
}
addEventListener('pagehide', dispose);

/* ================= СТАРТ ================= */
// Тени-подложки (radial texture) включаются/выключаются из админки.
scene.traverse(o => {
  if(o.material && o.material.map === shadowTex) o.visible = VIS.shadows;
});

camera.position.copy(CAM.iso.pos); curTgt.copy(CAM.iso.tgt); camera.lookAt(curTgt);
applyTheme(0); resize();
window.__ROAD_READY__ = true;
window.__RR_DEBUG__ = {
  frames: () => frames,
  inView: () => inView,
  buses: () => buses.map(b => ({ dir: b.dir, x: Math.round(b.x), state: b.state })),
  busSpawnT: () => busSpawnT,
  cars: () => cars.map(c => ({
    x: Number(c.x.toFixed(1)),
    z: Number(c.z.toFixed(1)),
    dir: c.dir,
    speed: Number(c.speed.toFixed(2))
  })),
  stopOff: () => STOP_OFF,
  scenario: () => ({ id: activeScenarioId, start: activeScenarioStart }),
  traffic: () => trafficEnabled,
  lights: () => IX.map((ix, i) => ({
    x: ix.x, car: lightState(ix, simTime), ped: pedLightState(ix, simTime),
    forced: Boolean(ix.forcePhase)
  })),
  counts: () => ({
    cars: cars.length, buses: buses.length,
    peds: peds.length, waiting: stopPeds.length
  }),
  fx: () => precip ? ({
    snowy: precip.userData.snowy,
    count: precip.geometry.attributes.position.count,
    size: precip.material.size,
    hasMap: Boolean(precip.material.map)
  }) : null,
  // Прямой вызов обработчика сценария — для проверки поведения.
  event: (type, params = {}) => applyScenarioEvent({ do: type, params }),
  start: (payload) => startScenario(payload),
  camera: (mode) => setMode(mode),
  vis: () => ({
    weatherPreset: VIS.weatherPreset,
    precipitation: VIS.precipitation,
    fog: VIS.fog,
    lightning: VIS.lightning,
    decoSnowfall: VIS.decoSnowfall,
    holidayPreset: VIS.holidayPreset,
    snowdrifts: VIS.decoSnowdrifts,
    flow: VIS.flow,
    speed: VIS.speed,
    themeT
  }),
  stopPeds: () => stopPeds.map(p => ({ side: p.side, x: Math.round(p.x), state: p.state })),
  peds: () => peds.map(p => ({
    x: Math.round(p.x),
    z: Number(p.z.toFixed(1)),
    state: p.state,
    light: p.ix ? pedLightState(p.ix, simTime) : null
  })),
  tick: (seconds = 1) => {
    const n = Math.max(1, Math.round(seconds * 60));
    for(let i=0;i<n;i++) step((1/60) * VIS.speed, 1/60);
    renderer.render(scene, camera);
    return simTime;
  }
};
requestAnimationFrame(loop);
</script>
<noscript><style>#fallback{display:block}</style></noscript>
