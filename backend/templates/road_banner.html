<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #9fd4ec; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: #9fd4ec; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #fallback { display: none; position: absolute; inset: 0; z-index: 3; }
  #fallback svg { width: 100%; height: 100%; display: block; }
  .fallback-note { position: absolute; bottom: 12px; right: 14px; font: 12px/1.4 system-ui, sans-serif; color: #f5ead9; background: rgba(13, 18, 32, .7); padding: 5px 11px; border-radius: 99px; }

  /* HUD — оверлей с погодой, пробками, временем (минималистичный) */
  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    pointer-events: none;
  }

  .hud-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    background: rgba(13, 18, 32, 0.65);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 6px;
    color: #f5ead9;
    font: 11px/1.3 system-ui, sans-serif;
    pointer-events: auto;
  }

  .hud-item b {
    color: #fff;
    font-weight: 700;
  }

  .hud-weather {
    font-size: 13px;
  }

  .hud-temp {
    font-size: 14px;
    font-weight: 700;
  }

  .hud-traffic {
    min-width: 80px;
  }

  /* Балл пробок — круг с числом по шкале Яндекса (0-3 / 4-6 / 7-9 / 10). */
  .hud-traffic-dot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #2fd27d;
    color: #08120c;
    font-size: 12px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.22);
    transition: background 0.3s;
  }

  .hud-traffic-dot.level-free {
    background: #2fd27d;
    color: #08120c;
  }

  .hud-traffic-dot.level-moderate {
    background: #ffb020;
    color: #241600;
  }

  .hud-traffic-dot.level-jam {
    background: #ff4d5e;
    color: #fff;
  }

  .hud-traffic-dot.level-gridlock {
    background: #9b111e;
    color: #fff;
  }

  .hud-holiday {
    color: #ffe9a8;
  }

  .hud-holiday[hidden] {
    display: none;
  }

  .hud-precip {
    font-size: 12px;
  }
</style>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= НАСТРОЙКИ ИЗ КОДА ================= */
// Админка редактирует блок #banner-settings; здесь он превращается
// в плоский объект значений.
function readSettings(){
  const el = document.getElementById('banner-settings');
  if(!el) return {};

  try {
    const raw = JSON.parse(el.textContent || '{}');
    const values = {};
    Object.entries(raw).forEach(([key, item]) => {
      values[key] = (item && typeof item === 'object' && 'value' in item)
        ? item.value
        : item;
    });
    return values;
  } catch (e) {
    return {};
  }
}
const SET = readSettings();
const num = (key, fallback, min, max) => {
  const value = Number(SET[key]);
  if(!Number.isFinite(value)) return fallback;
  return Math.max(min, Math.min(max, value));
};
const flag = (key, fallback) => (
  SET[key] === undefined ? fallback : Boolean(SET[key])
);

/* Синхронизация с внешними данными. По умолчанию включена: баннер показывает
   реальную погоду, пробки, текущее время суток и праздничные даты. */
const LIVE = {
  weather: flag('syncWeather', true),
  time: flag('syncTime', true),
  traffic: flag('syncTraffic', true),
  holidays: flag('syncHolidays', true)
};

/* ================= КОНФИГ ================= */
const QUALITY = ['eco','balanced','max'].includes(String(SET.quality))
  ? String(SET.quality)
  : 'eco';
const DEFAULTS = {
  speed:1, density:1, theme:'day', parallax:false,
  quality:QUALITY, paused:false, mode:'iso', buses:flag('buses', true)
};
const CFG = { ...DEFAULTS };
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (RM) { CFG.paused = true; CFG.parallax = false; }

const CYCLE = { g:9, y:2.2, r:8 }; CYCLE.total = CYCLE.g + CYCLE.y + CYCLE.r;
const IX = [ { x:-24, phase:0 }, { x:24, phase:7.5 } ];
const ROAD_HALF = 58, LANE_Z = 1.8, STOP_OFF = 7.2, ZEBRA_OFF = 4.6;
const CAR_LEN = 2.4, BUS_LEN = 5.8, ACCEL = 3.2, DECEL = 7.5, BRAKE_A = 5.5;
// Остановка на ДАЛЬНЕЙ стороне (−Z): автобусы идут справа налево (dir = −1)
const SHELTER_X = 12, BUS_STOP_X = SHELTER_X + 1.55, BAY_Z = -3.95, WAIT_Z = -6.15;
const CAR_COLORS = [0xff5a3c, 0xffb020, 0x2fd27d, 0x4da3ff, 0xff5ea8, 0xe8ecf5];

const $ = id => document.getElementById(id);
const stage = $('stage');
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;

/* ================= РАКУРС ИЗ НАСТРОЕК ================= */
const CAM_TARGET = new THREE.Vector3(-12, 4.5, -2);
const CAM_TILT = num('tilt', 32, 5, 85);           // наклон над горизонтом
const CAM_ROTATION = num('rotation', 38, -180, 180); // поворот вокруг цели
const CAM_SCALE = num('scale', 1, 0.5, 2);         // >1 — ближе
const CAM_RADIUS = 63.4;
const camElev = CAM_TILT * Math.PI / 180;
const camAzim = CAM_ROTATION * Math.PI / 180;
const CAM_ISO_POS = new THREE.Vector3(
  CAM_TARGET.x + CAM_RADIUS * Math.cos(camElev) * Math.sin(camAzim),
  CAM_TARGET.y + CAM_RADIUS * Math.sin(camElev),
  CAM_TARGET.z + CAM_RADIUS * Math.cos(camElev) * Math.cos(camAzim)
);

/* ================= RENDERER ================= */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
} catch(e) {
  $('fallback').style.display = 'block';
  throw e;
}
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
stage.prepend(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); $('fallback').style.display='block'; });
renderer.domElement.addEventListener('webglcontextrestored', () => { $('fallback').style.display='none'; });

const scene = new THREE.Scene();
const skyDay = new THREE.Color(0x9fd4ec), skyDusk = new THREE.Color(0x131a30);
scene.background = skyDay.clone();
scene.fog = new THREE.Fog(skyDay.clone(), 70, 165);

const camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,300);
const CAM = {
  iso:  { pos:CAM_ISO_POS, tgt:CAM_TARGET, zoom:1, minH:21 },
  side: { pos:new THREE.Vector3(8,10,52), tgt:new THREE.Vector3(0,2,0), zoom:1, minH:15 }
};
let camFrom = { pos:CAM.iso.pos.clone(), tgt:CAM.iso.tgt.clone(), zoom:1 };
let camTo = CAM.iso, camT = 1;
// dirty — нужен перерендер в паузе; inView — не рендерить вне вьюпорта.
let dirty = true;
let inView = true;
let frames = 0;
let last = performance.now();
const curTgt = CAM.iso.tgt.clone();
const parallax = { x:0, y:0, tx:0, ty:0 };

/* ================= СВЕТ ================= */
const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x7a8a6a, 0.9); scene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xfff2dd, 1.6); sunLight.position.set(35,55,25); scene.add(sunLight);

/* ================= ПРОЦЕДУРНЫЕ ТЕКСТУРЫ ================= */
function radialTex(inner, outer){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64,64,4,64,64,62);
  gr.addColorStop(0, inner); gr.addColorStop(1, outer);
  g.fillStyle = gr; g.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const shadowTex = radialTex('rgba(10,12,20,0.42)','rgba(10,12,20,0)');
const glowTex   = radialTex('rgba(255,255,255,1)','rgba(255,255,255,0)');
function windowTex(){
  const c = document.createElement('canvas'); c.width = 64; c.height = 128;
  const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0,0,64,128);
  for(let y=6; y<122; y+=10) for(let x=5; x<58; x+=10){
    if(Math.random() < .55){ g.fillStyle = Math.random() < .8 ? '#ffd9a0' : '#bfe0ff'; g.fillRect(x,y,6,7); }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
// Щит «АЛЬБИОН»: белый фон, красная надпись
const adCanvas = document.createElement('canvas'); adCanvas.width = 1024; adCanvas.height = 512;
const adTex = new THREE.CanvasTexture(adCanvas); adTex.colorSpace = THREE.SRGBColorSpace;
function drawAd(){
  const g = adCanvas.getContext('2d'), w = 1024, h = 512;
  g.fillStyle = '#ffffff'; g.fillRect(0,0,w,h);
  g.strokeStyle = '#e03131'; g.lineWidth = 14; g.strokeRect(18,18,w-36,h-36);
  g.fillStyle = '#e03131'; g.textAlign = 'center'; g.textBaseline = 'middle';
  let size = 230;
  g.font = `900 ${size}px 'Arial Black', Arial, sans-serif`;
  const maxW = w - 120;
  const tw = g.measureText('АЛЬБИОН').width;
  if(tw > maxW){ size = Math.floor(size * maxW / tw); g.font = `900 ${size}px 'Arial Black', Arial, sans-serif`; }
  g.fillText('АЛЬБИОН', w/2, h/2 + size*.04);
  adTex.needsUpdate = true;
}
drawAd();
// Знак остановки
const signCanvas = document.createElement('canvas'); signCanvas.width = signCanvas.height = 128;
{ const g = signCanvas.getContext('2d');
  g.fillStyle = '#4da3ff'; g.beginPath(); g.roundRect(4,4,120,120,14); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.roundRect(28,30,72,52,8); g.fill();
  g.fillStyle = '#4da3ff'; g.fillRect(34,38,60,18); g.fillRect(78,60,14,20);
  g.fillStyle = '#fff'; g.beginPath(); g.arc(44,92,8,0,7); g.arc(84,92,8,0,7); g.fill();
}
const signTex = new THREE.CanvasTexture(signCanvas); signTex.colorSpace = THREE.SRGBColorSpace;
// Табличка «ЦУМ»
const nameCanvas = document.createElement('canvas'); nameCanvas.width = 256; nameCanvas.height = 48;
const nameTex = new THREE.CanvasTexture(nameCanvas); nameTex.colorSpace = THREE.SRGBColorSpace;
function drawName(){
  const g = nameCanvas.getContext('2d');
  g.fillStyle = '#20263a'; g.fillRect(0,0,256,48);
  g.fillStyle = '#ffb020'; g.fillRect(0,0,6,48);
  g.fillStyle = '#f5ead9'; g.font = '800 24px Manrope, Arial, sans-serif'; g.textBaseline = 'middle';
  g.fillText('ЦУМ', 18, 17);
  g.fillStyle = '#93a0bd'; g.font = '700 12px Manrope, Arial, sans-serif';
  g.fillText('остановка · маршрут 1', 18, 37);

}
drawName();
// Табличка маршрута «1»
const routeCanvas = document.createElement('canvas'); routeCanvas.width = 64; routeCanvas.height = 32;
{ const g = routeCanvas.getContext('2d');
  g.fillStyle = '#101418'; g.fillRect(0,0,64,32);
  g.fillStyle = '#ffb020'; g.font = '900 26px Consolas, monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('1', 32, 17);
}
const routeTex = new THREE.CanvasTexture(routeCanvas); routeTex.colorSpace = THREE.SRGBColorSpace;
// Разметка «A» в кармане
const markACanvas = document.createElement('canvas'); markACanvas.width = markACanvas.height = 128;
{ const g = markACanvas.getContext('2d');
  g.clearRect(0,0,128,128);
  g.fillStyle = '#f5f2e8'; g.font = '900 104px Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('A', 64, 70);
}
const markATex = new THREE.CanvasTexture(markACanvas); markATex.colorSpace = THREE.SRGBColorSpace;
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawAd(); drawName(); });

/* ================= МАТЕРИАЛЫ ================= */

function edgeWalk(segs, zEdge, zWalk){
  segs.forEach(([a,b]) => {
    const len = b-a, cx = (a+b)/2;
    const edge = new THREE.Mesh(new THREE.BoxGeometry(len,.02,.14), M.mark);
    edge.position.set(cx,.011,zEdge); scene.add(edge);
    const walk = new THREE.Mesh(new THREE.BoxGeometry(len,.24,2.2), M.walk);
    walk.position.set(cx,0,zWalk); scene.add(walk);
  });
}

const dummy = new THREE.Object3D();
function instanced(geo, mat, transforms){
  const im = new THREE.InstancedMesh(geo, mat, transforms.length);
  transforms.forEach((tr,i) => {
    dummy.position.set(tr.x, tr.y ?? .012, tr.z);
    dummy.rotation.set(0, tr.ry ?? 0, 0);
    dummy.scale.setScalar(1); dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);
  });
  im.instanceMatrix.needsUpdate = true; scene.add(im); return im;
}

function buildCar(){
  const g = new THREE.Group();
  const bodyG = new THREE.Group(); g.add(bodyG);
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.3,.5,1.15), carMats[0]); body.position.y = .45; bodyG.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.15,.45,.95), M.glass); cabin.position.set(-.1,.9,0); bodyG.add(cabin);
  const wGeos = [];
  [[.72,.56],[.72,-.56],[-.72,.56],[-.72,-.56]].forEach(([x,z]) => {
    const w = new THREE.CylinderGeometry(.26,.26,.22,10); w.rotateX(Math.PI/2); w.translate(x,.26,z); wGeos.push(w);
  });
  g.add(new THREE.Mesh(mergeGeometries(wGeos), M.wheel));
  const hGeos = []; [.35,-.35].forEach(z => { const h = new THREE.BoxGeometry(.07,.12,.2); h.translate(1.16,.5,z); hGeos.push(h); });
  bodyG.add(new THREE.Mesh(mergeGeometries(hGeos), M.head));
  const tGeos = []; [.35,-.35].forEach(z => { const t = new THREE.BoxGeometry(.07,.12,.2); t.translate(-1.16,.5,z); tGeos.push(t); });
  bodyG.add(new THREE.Mesh(mergeGeometries(tGeos), M.tail));
  const glow = glowSprite(0xffe9b0, 1.8, 0); glow.position.set(1.4,.5,0); bodyG.add(glow);
  g.add(blobShadow(2.9,1.7));
  g.visible = false; scene.add(g);
  return { g, bodyG, body, glow, active:false, x:0, z:LANE_Z, dir:1, speed:0, max:6, len:CAR_LEN, seed:Math.random()*10, prevSpeed:0 };
}
const carPool = Array.from({ length:14 }, buildCar);
const cars = [];
function spawnCar(dir, atX){
  const c = carPool.find(c => !c.active); if(!c) return false;
  const spawnX = atX ?? -dir*(ROAD_HALF+2);
  if(cars.some(o => o.dir === dir && Math.abs(o.x - spawnX) < 7)) return false;
  if(buses.some(b => Math.abs(b.x - spawnX) < 9)) return false;
  c.active = true; c.dir = dir; c.x = spawnX; c.z = dir > 0 ? LANE_Z : -LANE_Z;
  c.max = rand(5.2,6.8); c.speed = atX ? c.max*.8 : c.max*.5; c.prevSpeed = c.speed;
  c.body.material = carMats[Math.floor(Math.random()*carMats.length)];
  c.g.position.set(c.x, 0, c.z);
  c.g.rotation.y = dir > 0 ? 0 : Math.PI;
  c.g.visible = true; cars.push(c); return true;
}
function despawnCar(c){ c.active = false; c.g.visible = false; cars.splice(cars.indexOf(c),1); }

  const doorL = new THREE.Mesh(new THREE.BoxGeometry(.52,1.2,.06), M.glass); doorL.position.set(1.28,.95,.85); bodyG.add(doorL);
  const doorR = new THREE.Mesh(new THREE.BoxGeometry(.52,1.2,.06), M.glass); doorR.position.set(1.82,.95,.85); bodyG.add(doorR);

           state:'run', willStop:true, doorT:0, dwellT:0, boardTimer:0, seed:Math.random()*10, prevSpeed:0 };
}

function buildPed(){

  const head = new THREE.Mesh(new THREE.SphereGeometry(.15,10,8), skinMat); head.position.y = .95; g.add(head);

  return { g, body, active:false, x:0, z:0, dz:1, speed:2.2, seed:Math.random()*10 };
}
const pedPool = Array.from({ length:6 }, buildPed);

function spawnPed(ix){

  if(cars.some(c => Math.abs(c.x - zx) < 5.5)) return;

  p.active = true; p.x = zx + rand(-1.4,1.4); p.z = startZ; p.dz = -Math.sign(startZ);
  p.speed = rand(2,2.6);
  p.body.material = pedMats[Math.floor(Math.random()*pedMats.length)];

function buildStopPed(){
  const p = buildPed();
  return Object.assign(p, { state:'in', tx:0, tz:WAIT_Z, outDir:1, boardT:0, bus:null });
}
const stopPool = Array.from({ length:8 }, buildStopPed);
const stopPeds = [];
let pedSpawnT = 2;
function waitSpot(){ return { x:SHELTER_X + rand(-2.2,2.2), z:WAIT_Z }; }
function spawnStopPed(state, x, z){
  const p = stopPool.find(p => !p.active); if(!p) return null;
  const spot = waitSpot();
  p.active = true; p.state = state; p.x = x; p.z = z; p.tx = spot.x; p.tz = spot.z;
  p.speed = rand(1.4,1.8); p.boardT = 0; p.bus = null; p.outDir = Math.random() < .5 ? -1 : 1;
  p.body.material = pedMats[Math.floor(Math.random()*pedMats.length)];
  p.g.scale.setScalar(1); p.g.position.set(x,0,z); p.g.visible = true;
  stopPeds.push(p); return p;
}
function despawnStopPed(p){ p.active = false; p.g.visible = false; p.bus = null; stopPeds.splice(stopPeds.indexOf(p),1); }
function sidewalkZ(x){ return Math.abs(x - SHELTER_X) < 7 ? WAIT_Z : -5.0; }
function movePed(p, tx, tz, sp, wdt){
  const dx = tx - p.x, dz = tz - p.z, d = Math.hypot(dx,dz);
  if(d > .001){
    const step = Math.min(d, sp*wdt);
    p.x += dx/d*step; p.z += dz/d*step;
    p.g.rotation.y = Math.atan2(dx,dz);
  }
  return d;
}
for(let i=0;i<3;i++){
  const s = waitSpot();
  const p = spawnStopPed('idle', s.x, s.z);
  if(p){ p.tx = s.x; p.tz = s.z; }
}

/* ================= СИМУЛЯЦИЯ ================= */
let simTime = 0;
const spawnT = [1, 2.2];
const prevState = ['g','g'];

// «Живой» трафик: плотность и количество меняются случайно, а скорость
// плавно ходит волной. Светофорный цикл при этом остаётся ровным.
const trafficLow = num('trafficMin', 0.55, 0.2, 3);
const trafficHigh = num('trafficMax', 1.9, 0.2, 3);
const TRAFFIC_MIN = Math.min(trafficLow, trafficHigh);
const TRAFFIC_MAX = Math.max(trafficLow, trafficHigh);
const trafficTimeLow = num('trafficChangeMin', 5, 1, 120);
const trafficTimeHigh = num('trafficChangeMax', 12, 1, 120);
const TRAFFIC_TIME_MIN = Math.min(trafficTimeLow, trafficTimeHigh);
const TRAFFIC_TIME_MAX = Math.max(trafficTimeLow, trafficTimeHigh);
const carLow = Math.floor(num('carMin', 6, 1, 14));
const carHigh = Math.floor(num('carMax', 13, 1, 14));
const CAR_MIN = Math.min(carLow, carHigh);
const CAR_MAX = Math.max(carLow, carHigh);
const pedLow = Math.floor(num('pedMin', 1, 0, 8));
const pedHigh = Math.floor(num('pedMax', 5, 0, 8));
const PED_MIN = Math.min(pedLow, pedHigh);
const PED_MAX = Math.max(pedLow, pedHigh);
const countTimeLow = num('countChangeMin', 6, 1, 120);
const countTimeHigh = num('countChangeMax', 14, 1, 120);
const COUNT_TIME_MIN = Math.min(countTimeLow, countTimeHigh);
const COUNT_TIME_MAX = Math.max(countTimeLow, countTimeHigh);
const SPEED_WAVE_AMP = num('speedWave', 0.35, 0, 0.8);
const SPEED_WAVE_FREQ = 2 * Math.PI / num('speedWavePeriod', 19.6, 4, 60);

let trafficDensity = TRAFFIC_MIN;
let trafficTimer = rand(TRAFFIC_TIME_MIN, TRAFFIC_TIME_MAX);
let carTarget = Math.floor(rand(CAR_MIN, CAR_MAX + 1));
let pedTarget = Math.floor(rand(PED_MIN, PED_MAX + 1));
let countTimer = rand(COUNT_TIME_MIN, COUNT_TIME_MAX);
spawnCar(1,-50); spawnCar(1,-26); spawnCar(1,-4);
spawnCar(-1,50); spawnCar(-1,26); spawnCar(-1,4);
spawnBus(40);

function vehicleObstacleDist(v, front){
  let dist = Infinity;
  IX.forEach(ix => {
    const lineX = ix.x - v.dir*STOP_OFF;
    const d = (lineX - front)*v.dir;
    if(d <= -.3) return;
    const st = lightState(ix, simTime);
    if(st === 'r' || (st === 'y' && d > 2.0)) dist = Math.min(dist, d);
  });
  cars.forEach(o => {
    if(o === v || o.dir !== v.dir) return;
    const dx = (o.x - v.x)*v.dir;
    if(dx > 0) dist = Math.min(dist, dx - (o.len + v.len)/2 - .35);
  });
  buses.forEach(o => {
    if(o === v || Math.abs(o.z) > 2.9) return;   // автобус в кармане — поток объезжает
    const dx = (o.x - v.x)*v.dir;
    if(dx > 0) dist = Math.min(dist, dx - (o.len + v.len)/2 - .45);
  });
  peds.forEach(p => {
    if(Math.abs(p.z) > 3.9) return;
    const d = (p.x - front)*v.dir;
    if(d > -.8 && d < 7) dist = Math.min(dist, d - 1.0);
  });
  return dist;
}
function drive(v, dist, wdt, accel, decel, speedScale = 1){
  const maxSpeed = v.max * speedScale;
  const target = dist <= .35 ? 0 : Math.min(maxSpeed, Math.sqrt(2*BRAKE_A*Math.max(0, dist-.35)) * speedScale);
  v.prevSpeed = v.speed;
  v.speed = target > v.speed ? Math.min(target, v.speed + accel*speedScale*wdt) : Math.max(target, v.speed - decel*speedScale*wdt);
  v.x += v.dir*v.speed*wdt;
}
function doorWorld(b){ return { x:b.x - 1.55, z:b.z - 1.15 }; }

function step(wdt, dt){
  simTime += wdt;

  // Скорость потока плавно «дышит» по настройкам из кода.
  const speedWave = 1 + SPEED_WAVE_AMP * Math.sin(simTime * SPEED_WAVE_FREQ);

  // Плотность трафика меняется в случайном порядке.
  trafficTimer -= wdt;
  if(trafficTimer <= 0){
    trafficDensity = rand(TRAFFIC_MIN, TRAFFIC_MAX);
    trafficTimer = rand(TRAFFIC_TIME_MIN, TRAFFIC_TIME_MAX);
  }

  // Количество машин и ожидающих пешеходов — тоже случайное.
  countTimer -= wdt;
  if(countTimer <= 0){
    carTarget = Math.floor(rand(CAR_MIN, CAR_MAX + 1));
    pedTarget = Math.floor(rand(PED_MIN, PED_MAX + 1));
    countTimer = rand(COUNT_TIME_MIN, COUNT_TIME_MAX);
  }

  IX.forEach((ix,i) => {
    const st = lightState(ix, simTime);
    if(st === 'r' && prevState[i] !== 'r' && Math.random() < .65){ spawnPed(ix); if(Math.random() < .4) spawnPed(ix); }
    prevState[i] = st;
  });
  lights.forEach(l => {
    const st = lightState(IX[l.ixIdx], simTime);
    ['r','y','g'].forEach(k => l.bulbs[k].forEach(b => b.material = bulbMats[k][k === st ? 'on' : 'off']));
    l.glow.material.color.setHex(BULB_C[st]); l.glow.position.y = BULB_Y[st];
  });

  [1,-1].forEach((dir,i) => {
    spawnT[i] -= wdt;
    if(spawnT[i] <= 0){
      const spawned = cars.length < carTarget ? spawnCar(dir) : false;
      spawnT[i] = spawned ? rand(2.2,4.4)/trafficDensity : .6;
    }
  });
  if(CFG.buses){
    busSpawnT -= wdt;
    if(busSpawnT <= 0) busSpawnT = spawnBus() ? rand(30,46)/trafficDensity : 3;
  }

  for(let i=cars.length-1; i>=0; i--){
    const c = cars[i];
    const front = c.x + c.dir*(c.len/2);
    drive(c, vehicleObstacleDist(c, front), wdt, ACCEL, DECEL, speedWave);
    c.g.position.set(c.x, 0, c.z);
    const acc = wdt > 0 ? (c.speed - c.prevSpeed)/wdt : 0;
    c.bodyG.rotation.z = lerp(c.bodyG.rotation.z, clamp(acc*.006,-.05,.05)*c.dir, .12);
    c.bodyG.position.y = Math.sin(simTime*6 + c.seed)*.012;
    if(Math.abs(c.x) > ROAD_HALF+3) despawnCar(c);
  }

  // автобус №1: справа налево, карман на дальней стороне
  for(let i=buses.length-1; i>=0; i--){
    const b = buses[i];
    const front = b.x + b.dir*(b.len/2);
    let zTarget = -LANE_Z;

    if(b.state === 'run'){
      let dist = vehicleObstacleDist(b, front);
      if(b.willStop && b.x > BUS_STOP_X - .5){
        const d = b.x - BUS_STOP_X;
        if(d > -.3) dist = Math.min(dist, d);
        if(b.x < BUS_STOP_X + 15) zTarget = BAY_Z;
      }
      drive(b, dist, wdt, 2.2, 6, speedWave);
      if(b.willStop && Math.abs(b.x - BUS_STOP_X) < .35 && b.speed < .25){
        b.x = BUS_STOP_X; b.speed = 0; b.state = 'dwell'; b.dwellT = 0; b.boardTimer = .7;
        const n = Math.random() < .3 ? 0 : (Math.random() < .6 ? 1 : 2);
        for(let k=0;k<n;k++){
          const dw = doorWorld(b);
          const p = spawnStopPed('alight', dw.x + rand(-.2,.2), dw.z);
          if(p) p.speed = rand(1.5,1.9);
        }
        flashBus('Автобус 1 на остановке «ЦУМ»');
      }
    }
    else if(b.state === 'dwell'){
      zTarget = BAY_Z; b.speed = 0;
      b.doorT = Math.min(1, b.doorT + wdt*2.5);
      b.dwellT += wdt;
      if(b.doorT > .8){
        b.boardTimer -= wdt;
        if(b.boardTimer <= 0){
          const idle = stopPeds.filter(p => p.state === 'idle');
          if(idle.length){
            const dw = doorWorld(b);
            idle.sort((a,c) => Math.abs(a.x-dw.x) - Math.abs(c.x-dw.x));
            idle[0].state = 'toBus'; idle[0].bus = b;
            b.boardTimer = .8;
          }
        }
      }
      const busy = stopPeds.some(p => p.bus === b && (p.state === 'toBus' || p.state === 'board'));
      const idleLeft = stopPeds.some(p => p.state === 'idle');
      if(b.dwellT > 2.4 && !busy && (!idleLeft || b.dwellT > 9)) b.state = 'close';
    }
    else if(b.state === 'close'){
      zTarget = BAY_Z; b.speed = 0;
      b.doorT = Math.max(0, b.doorT - wdt*2.5);
      if(b.doorT <= .05){ b.state = 'leave'; b.willStop = false; flashBus('Автобус 1 отправляется'); }
    }
    else if(b.state === 'leave'){
      let dist = vehicleObstacleDist(b, front);
      if(b.x > BUS_STOP_X - 8 && cars.some(c => c.dir === -1 && Math.abs(c.x - b.x) < 5.5)) dist = Math.min(dist, 0);
      zTarget = b.x > BUS_STOP_X - 8 ? BAY_Z : -LANE_Z;
      drive(b, dist, wdt, 2.0, 6, speedWave);
      if(b.x < BUS_STOP_X - 16) b.state = 'run';
    }

    b.z = lerp(b.z, zTarget, Math.min(1, wdt*1.6));
    b.g.position.set(b.x, 0, b.z);
    b.doorL.position.x = 1.28 - b.doorT*.3;
    b.doorR.position.x = 1.82 + b.doorT*.3;
    const acc = wdt > 0 ? (b.speed - b.prevSpeed)/wdt : 0;
    b.bodyG.rotation.z = lerp(b.bodyG.rotation.z, clamp(acc*.004,-.03,.03), .1);
    b.bodyG.position.y = Math.sin(simTime*5 + b.seed)*.01;
    if(Math.abs(b.x) > ROAD_HALF+4) despawnBus(b);
  }

  for(let i=peds.length-1; i>=0; i--){
    const p = peds[i];
    const hurry = IX.some(ix => Math.abs(p.x-ix.x) < 7 && lightState(ix, simTime) !== 'r') ? 1.7 : 1;
    p.z += p.dz*p.speed*hurry*wdt;
    p.g.position.set(p.x, Math.abs(Math.sin(simTime*8+p.seed))*.05, p.z);
    p.g.rotation.y = p.dz > 0 ? 0 : Math.PI;
    if(Math.abs(p.z) > 5.5){ p.active = false; p.g.visible = false; peds.splice(i,1); }
  }

  const waiting = stopPeds.filter(p => p.state === 'in' || p.state === 'idle').length;
  pedSpawnT -= wdt;
  if(pedSpawnT <= 0){
    pedSpawnT = rand(4,8);
    if(waiting < pedTarget){
      const fromLeft = Math.random() < .5;
      spawnStopPed('in', SHELTER_X + (fromLeft ? -1 : 1)*rand(16,24), -5.0);
    }
  }
  for(let i=stopPeds.length-1; i>=0; i--){
    const p = stopPeds[i];
    let bob = Math.abs(Math.sin(simTime*7+p.seed))*.04;
    if(p.state === 'in'){
      const d = movePed(p, p.tx, sidewalkZ(p.x), p.speed, wdt);
      if(d < .25){ p.state = 'idle'; }
    }
    else if(p.state === 'idle'){
      bob = Math.sin(simTime*2+p.seed)*.015 + .015;
      p.g.rotation.y = Math.sin(simTime*.7+p.seed)*.3;
    }
    else if(p.state === 'toBus'){
      if(!p.bus || !p.bus.active || p.bus.state === 'leave'){ p.state = 'idle'; p.bus = null; }
      else {
        const dw = doorWorld(p.bus);
        const d = movePed(p, dw.x, dw.z, 1.9, wdt);
        if(d < .3){ p.state = 'board'; p.boardT = 0; }
      }
    }
    else if(p.state === 'board'){
      p.boardT += wdt;
      const k = clamp(1 - p.boardT/.35, 0, 1);
      p.g.scale.setScalar(k);
      if(p.bus) p.z = lerp(p.z, p.bus.z - .5, Math.min(1, wdt*6));
      bob = 0;
      if(k <= 0){ despawnStopPed(p); continue; }
    }
    else if(p.state === 'alight'){
      const d = movePed(p, p.tx, sidewalkZ(p.x), p.speed, wdt);
      if(d < .3){ p.state = 'out'; }
    }
    else if(p.state === 'out'){
      p.x += p.outDir*p.speed*wdt;
      p.z = lerp(p.z, sidewalkZ(p.x), Math.min(1, wdt*3));
      p.g.rotation.y = p.outDir > 0 ? Math.PI/2 : -Math.PI/2;
      if(Math.abs(p.x - SHELTER_X) > 26){ despawnStopPed(p); continue; }
    }
    p.g.position.set(p.x, bob, p.z);
  }

  clouds.forEach(cl => { cl.position.x += .4*dt; if(cl.position.x > 75) cl.position.x = -75; });
}

function setMode(mode){
  CFG.mode = mode;
  camFrom = { pos:camera.position.clone(), tgt:curTgt.clone(), zoom:camera.zoom };
  camTo = CAM[mode]; camT = 0;
  resize();
  dirty = true;
}
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  if(!w || !h) return;
  const aspect = w/h;
  const baseHalfW = clamp(Math.max(15*aspect, camTo.minH*aspect), 32, 78);
  const halfW = baseHalfW / CAM_SCALE, halfH = halfW/aspect;
  camera.left = -halfW; camera.right = halfW; camera.top = halfH; camera.bottom = -halfH;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio({ eco:1, balanced:1.5, max:Math.min(devicePixelRatio,2) }[CFG.quality]);
  renderer.setSize(w, h, false);
  dirty = true;
}
new ResizeObserver(resize).observe(stage);

const CITY_CONFIG = {

  lon: 39.7230,
  timezone: 'Europe/Moscow'
};

let weatherData = null;
let trafficData = null;

let trafficSource = 'модель';

/* Сезонная модель — запасной вариант, когда синхронизация выключена или
   API недоступен. Значения детерминированы по часу, как и на бэкенде. */
function modelWeather() {
  const now = new Date();
  const month = now.getMonth() + 1;
  const hour = now.getHours();
  const seed = now.getFullYear() * 1000000 + month * 10000 + now.getDate() * 100 + hour;
  const noise = mod => (seed * 2654435761) % mod;

  const baseTemp = {
    12: 5, 1: 3, 2: 5, 3: 10, 4: 15, 5: 20,
    6: 25, 7: 28, 8: 27, 9: 22, 10: 15, 11: 8
  }[month] || 15;
  let offset = 0;
  if (hour >= 6 && hour <= 9) offset = -3;
  else if (hour >= 12 && hour <= 15) offset = 3;
  else if (hour >= 18 && hour <= 21) offset = -2;

  let weatherCode = 1;
  if ([11, 12, 1, 2].includes(month)) weatherCode = noise(3) === 0 ? 71 : 3;
  else if ([6, 7, 8].includes(month)) weatherCode = noise(4) === 0 ? 51 : 0;
  else weatherCode = noise(2) === 0 ? 3 : 0;

  weatherData = {
    temperature: baseTemp + offset + (noise(5) - 2),
    humidity: 50 + noise(30),
    windSpeed: 5 + noise(20),
    precipitation: weatherCode >= 51 && weatherCode < 80 ? 0.4 : 0,
    weatherCode
  };
  weatherSource = 'модель';
  updateWeatherHUD();
}

async function fetchWeather() {
  if (!LIVE.weather) {
    modelWeather();
    return;
  }

  try {
    // Прокси через бэкенд (CSP разрешает http://127.0.0.1:*)
    const response = await fetch('/api/roadrunner/weather-proxy');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();

    weatherData = {
      temperature: data.temperature_c,
      humidity: data.humidity,
      windSpeed: data.wind_speed_kmh,
      precipitation: data.precipitation_mm,
      weatherCode: data.weather_code || 0
    };
    weatherSource = data.source || 'модель';
    updateWeatherHUD();
  } catch (exc) {
    console.warn('Погода не загружена, используется модель:', exc);
    modelWeather();
  }
}

function weatherCodeToEmoji(code) {
  if (code === 0) return '☀️';
  if (code <= 3) return '⛅';
  if (code <= 48) return '🌫️';
  if (code <= 67) return '🌧️';
  if (code <= 77) return '❄️';
  if (code <= 82) return '🌦️';
  if (code <= 99) return '🌨️';
  return '☀️';
}

function weatherCodeToText(code) {
  if (code === 0) return 'ясно';
  if (code <= 3) return 'облачно';
  if (code <= 48) return 'туман';
  if (code <= 67) return 'дождь';
  if (code <= 77) return 'снег';
  if (code <= 82) return 'ливень';
  if (code <= 99) return 'метель';
  return 'ясно';
}

function updateWeatherHUD() {
  const emojiEl = document.getElementById('hudWeatherEmoji');
  const tempEl = document.getElementById('hudTempValue');
  const precipEmojiEl = document.getElementById('hudPrecipEmoji');
  const precipValueEl = document.getElementById('hudPrecipValue');

  if (weatherData) {
    emojiEl.textContent = weatherCodeToEmoji(weatherData.weatherCode);
    tempEl.textContent = `${Math.round(weatherData.temperature)}°`;
    // Осадки: если есть — показываем иконку и значение, если нет — прочерк
    if (weatherData.precipitation > 0) {
      precipEmojiEl.textContent = '🌧️';
      precipValueEl.textContent = `${weatherData.precipitation.toFixed(1)}`;
    } else {
      precipEmojiEl.textContent = '—';
      precipValueEl.textContent = '0';
    }
  } else {
    emojiEl.textContent = '—';
    tempEl.textContent = '—°';
    precipEmojiEl.textContent = '—';
    precipValueEl.textContent = '—';
  }
}

/* Шкала Яндекс.Пробок: 0-3 свободно, 4-6 умеренно, 7-9 пробки, 10 затор. */
function trafficLevel(score) {
  if (score <= 3) return { level: 'free', label: 'свободно' };
  if (score <= 6) return { level: 'moderate', label: 'умеренно' };
  if (score <= 9) return { level: 'jam', label: 'пробки' };
  return { level: 'gridlock', label: 'затор' };
}

function modelTraffic() {
  const hour = new Date().getHours();
  let score = 2;
  if (hour >= 7 && hour <= 10) score = 7;
  else if (hour >= 17 && hour <= 20) score = 8;
  else if (hour > 10 && hour < 17) score = 4;

  trafficData = { score, ...trafficLevel(score) };
  trafficSource = 'модель';
  updateTrafficHUD();
}

async function fetchTraffic() {
  if (!LIVE.traffic) {
    modelTraffic();
    return;
  }

  try {
    const response = await fetch('/api/roadrunner/traffic');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    const score = Math.max(0, Math.min(10, Number(data.data?.score || 0)));

    trafficData = {
      score,
      ...trafficLevel(score),
      label: data.data?.label || trafficLevel(score).label
    };
    trafficSource = data.data?.source || 'яндекс';
    updateTrafficHUD();
  } catch (exc) {
    console.warn('Пробки не загружены, используется модель:', exc);
    modelTraffic();
  }
}

function updateTrafficHUD() {
  const dotEl = document.getElementById('hudTrafficDot');

  if (trafficData) {
    dotEl.textContent = trafficData.score;
    dotEl.className = `hud-traffic-dot level-${trafficData.level}`;
    dotEl.title = `Пробки: ${trafficData.label} (${trafficData.score}/10) · ${trafficSource}`;
  } else {
    dotEl.textContent = '—';
    dotEl.className = 'hud-traffic-dot level-free';
    dotEl.title = 'Пробки: нет данных';
  }
}

/* Тема дня/ночи по реальным часам (0 — день, 1 — ночь).
   Плавные переходы: утро 5→8, вечер 18→21. */
function realNightFactor() {
  const hour = new Date().getHours() + new Date().getMinutes() / 60;
  if (hour >= 8 && hour < 18) return 0;
  if (hour >= 21 || hour < 5) return 1;
  if (hour >= 5 && hour < 8) return 1 - (hour - 5) / 3;
  return (hour - 18) / 3;
}

/* Повторяющиеся праздничные даты (месяц/день) из конфигурации Roadrunner. */
const HOLIDAYS = [
  { m: 1, d: 1, emoji: '🎄', name: 'Новый год' },
  { m: 2, d: 23, emoji: '⭐', name: 'День защитника Отечества' },
  { m: 3, d: 8, emoji: '🌷', name: '8 Марта' },
  { m: 5, d: 9, emoji: '🎖️', name: 'День Победы' },
  { m: 6, d: 25, emoji: '🎈', name: 'День рождения Альбион' }
];

function updateHolidayHUD() {
  const el = document.getElementById('hudHoliday');
  if (!el) return;

  if (!LIVE.holidays) {
    el.hidden = true;
    return;
  }

  const now = new Date();
  const holiday = HOLIDAYS.find(h => h.m === now.getMonth() + 1 && h.d === now.getDate());

  if (!holiday) {
    el.hidden = true;
    return;
  }

  el.hidden = false;
  el.textContent = `${holiday.emoji} ${holiday.name}`;
  el.title = `Праздничное оформление: ${holiday.name}`;
}

// Загружаем данные при старте и обновляем периодически
fetchWeather();
fetchTraffic();
updateHolidayHUD();

setInterval(fetchWeather, 600000); // 10 минут
setInterval(fetchTraffic, 300000); // 5 минут
setInterval(updateHolidayHUD, 60000); // 1 минута
new IntersectionObserver(e => { inView = e[0].isIntersecting; }, { threshold:.05 }).observe(stage);
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;

function loop(now){
  requestAnimationFrame(loop);
  const dt = clamp((now-last)/1000, 0, .05); last = now;
  if(!inView || document.hidden) return;

  let animating = false;
  if(!RM){
    // По умолчанию тема следует реальному времени суток; при выключенной
    // синхронизации остаётся декоративный цикл за DAY_NIGHT_PERIOD секунд.
    let night;
    if(LIVE.time){
      night = realNightFactor();
    } else {
      dayPhase = (dayPhase + dt / DAY_NIGHT_PERIOD) % 1;
      night = 0.5 - 0.5 * Math.cos(dayPhase * Math.PI * 2);
    }
    if(Math.abs(night - themeT) > 0.0005){
      themeT = night;
      applyTheme(themeT);
      animating = true;
    }
  }
  if(camT < 1){
    camT = Math.min(1, camT + dt/1.4);
    const k = ease(camT);
    camera.position.lerpVectors(camFrom.pos, camTo.pos, k);
    curTgt.lerpVectors(camFrom.tgt, camTo.tgt, k);
    camera.zoom = lerp(camFrom.zoom, camTo.zoom, k);
    camera.updateProjectionMatrix();
    animating = true;
  }
  parallax.x = lerp(parallax.x, CFG.parallax && !RM ? parallax.tx : 0, Math.min(1, dt*4));
  parallax.y = lerp(parallax.y, CFG.parallax && !RM ? parallax.ty : 0, Math.min(1, dt*4));
  camera.position.x += parallax.x; camera.position.y += parallax.y;
  camera.lookAt(curTgt.x + parallax.x*.6, curTgt.y + parallax.y*.6, curTgt.z);

  if(!CFG.paused){ step(dt, dt); renderer.render(scene, camera); frames++; }
  else if(animating || dirty){ renderer.render(scene, camera); frames++; dirty = false; }

}

/* ================= ОЧИСТКА ================= */
function dispose(){
  clearTimeout(flashT);
  scene.traverse(o => {
    if(o.geometry) o.geometry.dispose();
    if(o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if(m.map) m.map.dispose(); if(m.emissiveMap) m.emissiveMap.dispose(); m.dispose(); });
  });
  renderer.dispose();
}
addEventListener('pagehide', dispose);

/* ================= СТАРТ ================= */
camera.position.copy(CAM.iso.pos); curTgt.copy(CAM.iso.tgt); camera.lookAt(curTgt);
applyTheme(0); resize();
window.__ROAD_READY__ = true;
requestAnimationFrame(loop);
</script>
