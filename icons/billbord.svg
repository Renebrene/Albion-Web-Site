<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 212" width="500" height="424">
  <title>Рекламный щит на опоре</title>
  <desc>Красное прямоугольное табло в чёрной рамке, три стрелки вверх сверху, чёрная стойка с опорой. Прозрачный фон.</desc>

  <!-- стрелки вверх над щитом -->
  <g fill="#000000">
    <path d="M56 14 H70 L75 25 H51 Z"/>
    <rect x="61" y="23" width="4" height="16"/>
    <path d="M118 14 H132 L137 25 H113 Z"/>
    <rect x="123" y="23" width="4" height="16"/>
    <path d="M180 14 H194 L199 25 H175 Z"/>
    <rect x="185" y="23" width="4" height="16"/>
  </g>

  <!-- лицевая сторона щита -->
  <rect x="47" y="45" width="156" height="82" fill="#E31E24"/>

  <!-- рамка щита -->
  <rect x="43.5" y="41.5" width="163" height="89" fill="none" stroke="#000000" stroke-width="7"/>

  <!-- стойка и опора -->
  <g fill="#000000">
    <rect x="116" y="134" width="18" height="54"/>
    <path d="M94 188 H156 L163 201 H87 Z"/>
  </g>
</svg>
