  <desc>Вертикальное красное табло в чёрной рамке на чёрном основании. Прозрачный фон.</desc>

  <!-- тень на земле -->
  <ellipse class="icon-ground-shadow" cx="52" cy="149" rx="27" ry="4" fill="#000000" opacity="0.3"/>

  <!-- лицевая сторона пиллара -->
